últiplos (lo decide el usuario)\n        int numero;\n\n        // Variable que va tomando el valor de cada múltiplo: numero, numero*2, numero*3...\n        int multiplo;\n\n        // Pedimos el número entero (debe ser mayor que 0)\n        System.out.print(\"Introduce un numero entero positivo: \");\n        numero = teclado.nextInt();\n\n        // El primer múltiplo de un número es el propio número (numero * 1)\n        multiplo = numero;\n\n        // Bucle while: se repite MIENTRAS el múltiplo sea menor o igual que 100.\n        // La condición se comprueba ANTES de cada vuelta, así que si el número\n        // es mayor que 100 el bucle no se ejecuta ni una vez.\n        while (multiplo <= 100) {\n\n            // Mostramos el múltiplo actual\n            System.out.println(multiplo);\n\n            // Pasamos al siguiente múltiplo sumándole el número otra vez.\n            // Ejemplo con 15: 15 -> 30 -> 45 -> 60 -> 75 -> 90 -> 105 (105 > 100, se acaba)\n            // IMPORTANTE: esta línea es la que hace que el bucle termine algún día.\n            // Si la olvidamos, multiplo nunca cambia y el bucle es infinito.\n            multiplo += numero;\n        }\n\n        // Cerramos el Scanner\n        teclado.close();\n\n    }\n}\n","steps":[{"a":1,"b":1,"t":"Trae la clase Scanner al programa. Sin este import, Java no sabe qué es Scanner y da error.","base":true},{"a":3,"b":4,"t":"La clase se llama igual que el archivo. main es el punto de entrada: Java empieza a ejecutar aquí dentro.","base":true},{"a":5,"b":5,"t":"Crea el lector del teclado. System.in es la entrada estándar. El nombre teclado lo eliges tú.","base":true},{"a":11,"b":11,"t":"Va tomando el valor de cada múltiplo: numero, 2·numero, 3·numero…","base":false},{"a":14,"b":15,"t":"Se lee el número.","base":false},{"a":18,"b":18,"t":"El primer múltiplo es el propio número.","base":false},{"a":23,"b":23,"t":"Mientras el múltiplo sea <= 100 se repite. La condición se comprueba ANTES de cada vuelta; si el número es mayor que 100, no se ejecuta ni una vez.","base":false},{"a":26,"b":26,"t":"Muestra el múltiplo actual.","base":false},{"a":32,"b":32,"t":"Pasa al siguiente sumando el número otra vez (15 → 30 → 45…). Esta línea es la que hace que el bucle termine; sin ella sería infinito.","base":false},{"a":36,"b":36,"t":"Cierra el Scanner para liberar el recurso. Va al final.","base":true}],"ojo":null,"labelFull":"unidad 3 bloque 2 ejercicio 3"},{"id":"Ejercicio4_Unidad3_B2","kind":"ej","label":"U3·B2·E4","grupo":"Unidad 3 · Bloque 2","orden":30204,"file":"Ejercicio4_Unidad3_B2.java","titulo":"Múltiplos de un número hasta un límite (do-while)","enun":"Igual que el anterior, pero el límite lo decide el usuario y se usa do-while.","tags":["Scanner","nextInt","int","do-while","if","múltiplos"],"kw":["multiplos","bucle do while","limite","hasta un limite","se ejecuta al menos una vez"],"code":"import java.util.Scanner;\n\npublic class Ejercicio4_Unidad3_B2 {\n    public static void main(String[] args) {\n        Scanner teclado = new Scanner(System.in);\n\n        // Número del que queremos los múltiplos\n        int numero;\n\n        // Límite hasta el que queremos calcular (ahora lo decide el usuario)\n        int limite;\n\n        // Variable que va tomando el valor de cada múltiplo\n        int multiplo;\n\n        // Pedimos los dos datos al usuario\n        System.out.print(\"Numero: \");\n        numero = teclado.nextInt();\n\n        System.out.print(\"Limite: \");\n        limite = teclado.nextInt();\n\n        // Empezamos por el primer múltiplo: el propio número\n        multiplo = numero;\n\n        // Bucle do-while: la diferencia con while es que la condición se comprueba\n        // AL FINAL de cada vuelta, así que el cuerpo se ejecuta SIEMPRE al menos una vez.\n        // Por eso lo protegemos con un if: si el número ya es mayor que el límite,\n        // no hay ningún múltiplo válido y no debemos mostrar nada\n        // (sin el if, mostraría el primer múltiplo aunque se pasara del límite).\n        if (numero <= limite) {\n            do {\n                // Mostramos el múltiplo actual\n                System.out.println(multiplo);\n\n                // Calculamos el siguiente múltiplo\n                multiplo += numero;\n\n            } while (multiplo <= limite); // Si se cumple, repetimos; si no, salimos\n            // OJO: el do-while termina con punto y coma (;) después del paréntesis\n        }\n\n        // Cerramos el Scanner\n        teclado.close();\n    }\n}\n","steps":[{"a":1,"b":1,"t":"Trae la clase Scanner al programa. Sin este import, Java no sabe qué es Scanner y da error.","base":true},{"a":3,"b":4,"t":"La clase se llama igual que el archivo. main es el punto de entrada: Java empieza a ejecutar aquí dentro.","base":true},{"a":5,"b":5,"t":"Crea el lector del teclado. System.in es la entrada estándar. El nombre teclado lo eliges tú.","base":true},{"a":11,"b":11,"t":"El tope hasta el que se calculan los múltiplos.","base":false},{"a":17,"b":21,"t":"Se piden número y límite.","base":false},{"a":24,"b":24,"t":"Se empieza por el primer múltiplo: el propio número.","base":false},{"a":31,"b":31,"t":"do-while ejecuta el cuerpo SIEMPRE una vez, porque comprueba al final. Este if evita mostrar nada cuando el número ya supera el límite.","base":false},{"a":32,"b":34,"t":"Entra al bucle y muestra el múltiplo actual.","base":false},{"a":37,"b":37,"t":"Calcula el siguiente múltiplo.","base":false},{"a":39,"b":39,"t":"La condición va al final: si se cumple, repite. OJO: el do-while termina con punto y coma ;","base":false},{"a":44,"b":44,"t":"Cierra el Scanner para liberar el recurso. Va al final.","base":true}],"ojo":null,"labelFull":"unidad 3 bloque 2 ejercicio 4"},{"id":"Ejercicio1_Unidad3_B3","kind":"ej","label":"U3·B3·E1","grupo":"Unidad 3 · Bloque 3","orden":30301,"file":"Ejercicio1_Unidad3_B3.java","titulo":"Suma y media de consumos hasta escribir 0","enun":"Lee consumos hasta que el usuario escribe 0 y muestra la suma y la media.","tags":["Scanner","nextDouble","double","while","centinela","acumulador","contador","media","if-else"],"kw":["hasta que escriba 0","valor centinela","terminar con cero","consumos","sumar y media","no se cuantos datos"],"code":"import java.util.Scanner;\n\npublic class Ejercicio1_Unidad3_B3 {\n    public static void main(String[] args) {\n        Scanner teclado = new Scanner(System.in);\n\n        // Cada consumo que escribe el usuario. Usamos double porque son números reales\n        double consumo;\n\n        // Acumulador de la suma total de consumos. Empieza en 0.\n        double suma = 0;\n\n        // CONTADOR de cuántos consumos válidos se han introducido.\n        // Lo necesitamos para la media, porque ahora NO sabemos de antemano\n        // cuántos valores va a escribir el usuario.\n        int contador = 0;\n\n        // Aquí guardaremos la media\n        double media;\n\n        // Leemos el PRIMER consumo antes del bucle.\n        // Es necesario para poder comprobar si el usuario escribe 0 de entrada.\n        System.out.print(\"Introduce un consumo (0 para terminar): \");\n        consumo = teclado.nextDouble();\n\n        // Bucle while: se repite MIENTRAS el consumo sea distinto de 0.\n        // El 0 es el valor centinela: cuando aparece, el bucle termina\n        // y ese 0 NO se suma ni se cuenta.\n        while (consumo != 0) {\n\n            // Sumamos el consumo al total\n            suma += consumo;\n\n            // Contamos un consumo más\n            contador++;\n\n            // Pedimos el SIGUIENTE consumo. Esta lectura es la que permite\n            // que el bucle termine algún día. Si la olvidamos, el bucle es infinito.\n            System.out.print(\"Introduce un consumo (0 para terminar): \");\n            consumo = teclado.nextDouble();\n        }\n\n        // Al salir del bucle, comprobamos si se introdujo algún consumo.\n        // Si el usuario escribió 0 directamente, contador vale 0 y dividir\n        // entre 0 daría un resultado raro (NaN), así que lo evitamos con un if.\n        if (contador > 0) {\n            // La media se calcula FUERA del bucle: suma total / cantidad de consumos\n            media = suma / contador;\n\n            System.out.println(\"La suma total de consumos es: \" + suma);\n            System.out.println(\"La media de consumos es: \" + media);\n        } else {\n            System.out.println(\"No se ha introducido ningun consumo.\");\n        }\n\n        // Cerramos el Scanner\n        teclado.close();\n    }\n}\n","steps":[{"a":1,"b":1,"t":"Trae la clase Scanner al programa. Sin este import, Java no sabe qué es Scanner y da error.","base":true},{"a":3,"b":4,"t":"La clase se llama igual que el archivo. main es el punto de entrada: Java empieza a ejecutar aquí dentro.","base":true},{"a":5,"b":5,"t":"Crea el lector del teclado. System.in es la entrada estándar. El nombre teclado lo eliges tú.","base":true},{"a":8,"b":8,"t":"Cada consumo que escribe el usuario.","base":false},{"a":11,"b":11,"t":"Acumulador del total, empieza en 0.","base":false},{"a":16,"b":16,"t":"Cuenta los consumos válidos. Hace falta para la media porque ahora no sabemos de antemano cuántos habrá.","base":false},{"a":23,"b":24,"t":"Se lee el PRIMER consumo antes del bucle, para poder comprobar si escribe 0 de entrada.","base":false},{"a":29,"b":29,"t":"Se repite mientras no escriba 0. El 0 es el valor centinela: marca el final y no se suma ni se cuenta.","base":false},{"a":32,"b":35,"t":"Dentro del bucle se suma el valor al total y se cuenta uno más.","base":false},{"a":39,"b":40,"t":"Se lee el SIGUIENTE consumo al final de cada vuelta. Si se olvida, el bucle es infinito.","base":false},{"a":46,"b":51,"t":"Antes de calcular la media se comprueba que hubo algún dato, para no dividir entre 0 (daría NaN). La media va fuera del bucle: suma / contador.","base":false},{"a":52,"b":53,"t":"Si el usuario escribió 0 directamente, se avisa.","base":false},{"a":57,"b":57,"t":"Cierra el Scanner para liberar el recurso. Va al final.","base":true}],"ojo":null,"labelFull":"unidad 3 bloque 3 ejercicio 1"},{"id":"Ejercicio2_Unidad3_B3","kind":"ej","label":"U3·B3·E2","grupo":"Unidad 3 · Bloque 3","orden":30302,"file":"Ejercicio2_Unidad3_B3.java","titulo":"Máxima y mínima temperatura hasta escribir 0","enun":"Lee temperaturas hasta que se escribe 0 y muestra la más alta y la más baja.","tags":["Scanner","nextInt","int","while","centinela","máximo","mínimo","contador","if-else","Integer.MAX_VALUE"],"kw":["hasta que escriba 0","valor centinela","maximo y minimo","temperaturas","no se cuantos datos"],"code":"import java.util.Scanner;\n\npublic class Ejercicio2_Unidad3_B3 {\n    public static void main(String[] args) {\n        Scanner teclado = new Scanner(System.in);\n\n        // Cada temperatura que escribe el usuario\n        int temperatura;\n\n        // Valores de partida \"extremos\" para buscar máximo y mínimo\n        // (explicado en el ejercicio de la unidad anterior):\n        // maxima empieza en lo más bajo posible y minima en lo más alto posible,\n        // así la primera temperatura siempre las sustituye.\n        int maxima = Integer.MIN_VALUE;\n        int minima = Integer.MAX_VALUE;\n\n        // Contador de temperaturas introducidas. Lo usamos al final para saber\n        // si el usuario escribió alguna o terminó directamente con 0.\n        int contador = 0;\n\n        // Leemos la PRIMERA temperatura antes del bucle\n        System.out.print(\"Introduce una temperatura (0 para terminar): \");\n        temperatura = teclado.nextInt();\n\n        // Mientras no sea el centinela (0), seguimos procesando\n        while (temperatura != 0) {\n\n            // Contamos una temperatura más\n            contador++;\n\n            // Si es mayor que la máxima guardada, pasa a ser la nueva máxima\n            if (temperatura > maxima) {\n                maxima = temperatura;\n            }\n\n            // Si es menor que la mínima guardada, pasa a ser la nueva mínima.\n            // Son dos if separados (no else if) porque con la primera\n            // temperatura se cumplen las dos condiciones a la vez.\n            if (temperatura < minima) {\n                minima = temperatura;\n            }\n\n            // Pedimos la SIGUIENTE temperatura (así el bucle puede terminar)\n            System.out.print(\"Introduce una temperatura (0 para terminar): \");\n            temperatura = teclado.nextInt();\n        }\n\n        // Si no se introdujo ninguna temperatura, maxima y minima seguirían\n        // con sus valores de partida (-2147483648 y 2147483647), que no tienen\n        // sentido. Por eso comprobamos el contador antes de mostrar nada.\n        if (contador > 0) {\n            System.out.println(\"La temperatura mas alta es: \" + maxima);\n            System.out.println(\"La temperatura mas baja es: \" + minima);\n        } else {\n            System.out.println(\"No se ha introducido ninguna temperatura.\");\n        }\n\n        // Cerramos el Scanner\n        teclado.close();\n    }\n}\n","steps":[{"a":1,"b":1,"t":"Trae la clase Scanner al programa. Sin este import, Java no sabe qué es Scanner y da error.","base":true},{"a":3,"b":4,"t":"La clase se llama igual que el archivo. main es el punto de entrada: Java empieza a ejecutar aquí dentro.","base":true},{"a":5,"b":5,"t":"Crea el lector del teclado. System.in es la entrada estándar. El nombre teclado lo eliges tú.","base":true},{"a":14,"b":15,"t":"Valores de partida extremos para que la primera temperatura sustituya a las dos.","base":false},{"a":19,"b":19,"t":"Cuenta cuántas temperaturas se escribieron, para saber al final si hay resultados.","base":false},{"a":22,"b":23,"t":"Primera lectura antes del bucle.","base":false},{"a":26,"b":26,"t":"Mientras no sea el centinela (0), se sigue procesando.","base":false},{"a":29,"b":29,"t":"Una temperatura más.","base":false},{"a":32,"b":33,"t":"Nueva máxima si supera a la guardada.","base":false},{"a":39,"b":40,"t":"Nueva mínima si es menor. Dos if separados.","base":false},{"a":44,"b":45,"t":"Siguiente lectura al final de la vuelta, para que el bucle pueda terminar.","base":false},{"a":51,"b":51,"t":"Si no hubo temperaturas, maxima y minima siguen con valores absurdos (-2147483648 y 2147483647); por eso se comprueba antes de mostrar.","base":false},{"a":54,"b":55,"t":"Mensaje cuando no hubo datos.","base":false},{"a":59,"b":59,"t":"Cierra el Scanner para liberar el recurso. Va al final.","base":true}],"ojo":null,"labelFull":"unidad 3 bloque 3 ejercicio 2"},{"id":"Ejercicio3_Unidad3_B3","kind":"ej","label":"U3·B3·E3","grupo":"Unidad 3 · Bloque 3","orden":30303,"file":"Ejercicio3_Unidad3_B3.java","titulo":"Tabla de multiplicar de varios números hasta escribir 0","enun":"Pide números y muestra la tabla de multiplicar (0 a 10) de cada uno hasta que se escribe 0.","tags":["Scanner","nextInt","int","while","for","bucle anidado","centinela","tabla de multiplicar","concatenar texto"],"kw":["tabla de multiplicar","tablas","multiplicar","bucles anidados","for dentro de while","del 0 al 10","5 x 3 = 15"],"code":"import java.util.Scanner;\n\npublic class Ejercicio3_Unidad3_B3 {\n    public static void main(String[] args) {\n        Scanner teclado = new Scanner(System.in);\n\n        // Número del que mostraremos la tabla\n        int numero;\n\n        // Leemos el PRIMER número antes del bucle\n        System.out.print(\"Introduce un numero (0 para terminar): \");\n        numero = teclado.nextInt();\n\n        // Bucle EXTERIOR (while): se repite mientras el usuario no escriba 0.\n        // Cada vuelta de este bucle muestra UNA tabla completa.\n        while (numero != 0) {\n\n            // Bucle INTERIOR (for): muestra las 11 líneas de la tabla.\n            // Aquí sí sabemos cuántas vueltas hay (siempre de 0 a 10),\n            // por eso usamos un for en lugar de un while.\n            // El contador i toma los valores 0, 1, 2, ..., 10\n            for (int i = 0; i <= 10; i++) {\n\n                // Mostramos la línea con el formato pedido: 5 x 3 = 15\n                // Los textos entre comillas se escriben tal cual y\n                // numero * i es la operación, que Java calcula al mostrarla.\n                // Los paréntesis son necesarios para que Java haga la\n                // multiplicación y no intente concatenar el número como texto.\n                System.out.println(numero + \" x \" + i + \" = \" + (numero * i));\n            }\n\n            // Pedimos el SIGUIENTE número (así el bucle exterior puede terminar)\n            System.out.print(\"Introduce un numero (0 para terminar): \");\n            numero = teclado.nextInt();\n        }\n\n        // Cerramos el Scanner\n        teclado.close();\n    }\n}\n","steps":[{"a":1,"b":1,"t":"Trae la clase Scanner al programa. Sin este import, Java no sabe qué es Scanner y da error.","base":true},{"a":3,"b":4,"t":"La clase se llama igual que el archivo. main es el punto de entrada: Java empieza a ejecutar aquí dentro.","base":true},{"a":5,"b":5,"t":"Crea el lector del teclado. System.in es la entrada estándar. El nombre teclado lo eliges tú.","base":true},{"a":11,"b":12,"t":"Primera lectura antes del bucle.","base":false},{"a":16,"b":16,"t":"BUCLE EXTERIOR: cada vuelta muestra UNA tabla completa y termina cuando se escribe 0.","base":false},{"a":22,"b":22,"t":"BUCLE INTERIOR: aquí sí se sabe cuántas vueltas hay (siempre de 0 a 10), por eso es un for. i es el multiplicador.","base":false},{"a":29,"b":29,"t":"Una línea de la tabla: 5 x 3 = 15. Los textos entre comillas salen tal cual; (numero * i) calcula. Los paréntesis hacen que Java multiplique en vez de pegar el número como texto.","base":false},{"a":33,"b":34,"t":"Siguiente número al final de la vuelta del while, para que el bucle exterior pueda terminar.","base":false},{"a":38,"b":38,"t":"Cierra el Scanner para liberar el recurso. Va al final.","base":true}],"ojo":null,"labelFull":"unidad 3 bloque 3 ejercicio 3"},{"id":"Ejercicio4_Unidad3_B3","kind":"ej","label":"U3·B3·E4","grupo":"Unidad 3 · Bloque 3","orden":30304,"file":"Ejercicio4_Unidad3_B3.java","titulo":"Contar variaciones positivas y negativas hasta 0","enun":"Lee variaciones hasta que se escribe 0 y cuenta cuántas son positivas y cuántas negativas.","tags":["Scanner","nextInt","int","while","centinela","contador","if-else"],"kw":["hasta que escriba 0","valor centinela","contar positivos y negativos","variacion","no se cuantos datos"],"code":"import java.util.Scanner;\n\npublic class Ejercicio4_Unidad3_B3 {\n    public static void main(String[] args) {\n        Scanner teclado = new Scanner(System.in);\n\n        // Cada variación que escribe el usuario (entera, positiva o negativa)\n        int variacion;\n\n        // CONTADORES: cuentan cuántas veces ocurre algo (suman 1, no el valor).\n        // Ambos empiezan en 0.\n        int positivos = 0;\n        int negativos = 0;\n\n        // Leemos la PRIMERA variación antes del bucle\n        System.out.print(\"Introduce una variacion (0 para terminar): \");\n        variacion = teclado.nextInt();\n\n        // Mientras no sea el centinela (0), seguimos procesando\n        while (variacion != 0) {\n\n            // Si es mayor que 0, es positiva: sumamos 1 al contador de positivos\n            if (variacion > 0) {\n                positivos++;   // equivale a: positivos = positivos + 1\n            }\n            // Si no es positiva, como dentro del bucle nunca vale 0,\n            // solo puede ser negativa. Por eso basta con un else\n            // (no hace falta else if (variacion < 0)).\n            else {\n                negativos++;\n            }\n\n            // Pedimos la SIGUIENTE variación (así el bucle puede terminar)\n            System.out.print(\"Introduce una variacion (0 para terminar): \");\n            variacion = teclado.nextInt();\n        }\n\n        // Mostramos los dos contadores al terminar el bucle\n        System.out.println(\"Valores positivos: \" + positivos);\n        System.out.println(\"Valores negativos: \" + negativos);\n\n        // Cerramos el Scanner\n        teclado.close();\n    }\n}\n","steps":[{"a":1,"b":1,"t":"Trae la clase Scanner al programa. Sin este import, Java no sabe qué es Scanner y da error.","base":true},{"a":3,"b":4,"t":"La clase se llama igual que el archivo. main es el punto de entrada: Java empieza a ejecutar aquí dentro.","base":true},{"a":5,"b":5,"t":"Crea el lector del teclado. System.in es la entrada estándar. El nombre teclado lo eliges tú.","base":true},{"a":12,"b":13,"t":"Contadores, empiezan en 0.","base":false},{"a":16,"b":17,"t":"Primera lectura antes del bucle.","base":false},{"a":20,"b":20,"t":"Se repite mientras no sea el centinela (0).","base":false},{"a":23,"b":24,"t":"Si es positiva, suma 1 al contador de positivos.","base":false},{"a":29,"b":30,"t":"Dentro del bucle nunca vale 0, así que si no es positiva solo puede ser negativa: basta un else, sin else if.","base":false},{"a":34,"b":35,"t":"Lectura siguiente al final de la vuelta.","base":false},{"a":39,"b":40,"t":"Se muestran los contadores.","base":false},{"a":43,"b":43,"t":"Cierra el Scanner para liberar el recurso. Va al final.","base":true}],"ojo":null,"labelFull":"unidad 3 bloque 3 ejercicio 4"},{"id":"Ejercicio1_Unidad3_B4","kind":"ej","label":"U3·B4·E1","grupo":"Unidad 3 · Bloque 4","orden":30401,"file":"Ejercicio1_Unidad3_B4.java","titulo":"Saber si un número es primo","enun":"Lee un identificador y dice si es primo o compuesto.","tags":["Scanner","nextInt","int","boolean","while","if-else","módulo %","bandera (flag)","número primo"],"kw":["primo","numero primo","divisores","compuesto","raiz cuadrada","flag","bandera","es primo"],"code":"import java.util.Scanner;\n\npublic class Ejercicio1_Unidad3_B4 {\n    public static void main(String[] args) {\n        Scanner teclado = new Scanner(System.in);\n        // Identificador del sample que escribe el usuario\n        int id;\n\n        // BANDERA (flag): variable booleana que guarda un \"estado\".\n        // Suponemos que el número ES primo y buscamos un divisor que lo desmienta.\n        boolean primo;\n\n        // Posible divisor que vamos probando. Empieza en 2, porque\n        // dividir entre 1 siempre da resto 0 y no aporta información.\n        int divisor = 2;\n\n        // Pedimos el identificador\n        System.out.print(\"Introduce el identificador del sample: \");\n        id = teclado.nextInt();\n\n        // Los números menores que 2 (0, 1 y negativos) no son primos.\n        // Si es 2 o más, partimos de la suposición de que es primo.\n        primo = id >= 2;\n\n        // Seguimos probando divisores MIENTRAS el número siga pareciendo primo\n        // y el divisor no supere la raíz cuadrada del número.\n        // (Si un número tiene un divisor mayor que su raíz, también tiene\n        // otro menor que su raíz, así que no hace falta probar más allá.)\n        // divisor * divisor <= id equivale a divisor <= raíz de id.\n        while (primo && divisor * divisor <= id) {\n\n            // Si el resto de la división es 0, el divisor divide\n            // exactamente al número: ya sabemos que es compuesto\n            if (id % divisor == 0) {\n                primo = false;\n            }\n\n            // Probamos con el siguiente divisor\n            divisor++;\n        }\n\n        // Mostramos el resultado según el estado final de la bandera\n        if (primo) {\n            System.out.println(\"El identificador es primo.\");\n        } else {\n            System.out.println(\"El identificador es compuesto.\");\n        }\n\n        // Cerramos el Scanner\n        teclado.close();\n    }\n}\n","steps":[{"a":1,"b":1,"t":"Trae la clase Scanner al programa. Sin este import, Java no sabe qué es Scanner y da error.","base":true},{"a":3,"b":4,"t":"La clase se llama igual que el archivo. main es el punto de entrada: Java empieza a ejecutar aquí dentro.","base":true},{"a":5,"b":5,"t":"Crea el lector del teclado. System.in es la entrada estándar. El nombre teclado lo eliges tú.","base":true},{"a":11,"b":11,"t":"BANDERA (flag): variable boolean que guarda un estado. Se supone que el número ES primo y se busca un divisor que lo desmienta.","base":false},{"a":15,"b":15,"t":"Posible divisor a probar. Empieza en 2 porque dividir entre 1 siempre da resto 0 y no aporta nada.","base":false},{"a":18,"b":19,"t":"Se lee el número.","base":false},{"a":23,"b":23,"t":"Los menores que 2 (0, 1, negativos) no son primos. Desde 2 se parte de que sí lo es.","base":false},{"a":30,"b":30,"t":"Sigue probando mientras parezca primo Y el divisor no pase de la raíz cuadrada. Si tiene un divisor mayor que la raíz, también tiene uno menor, así que no hace falta seguir. divisor*divisor <= id equivale a divisor <= raíz.","base":false},{"a":34,"b":35,"t":"Si el resto es 0, el divisor divide exactamente: es compuesto y se baja la bandera.","base":false},{"a":39,"b":39,"t":"Se prueba el siguiente divisor.","base":false},{"a":43,"b":46,"t":"Según el estado final de la bandera se muestra un mensaje u otro.","base":false},{"a":50,"b":50,"t":"Cierra el Scanner para liberar el recurso. Va al final.","base":true}],"ojo":null,"labelFull":"unidad 3 bloque 4 ejercicio 1"},{"id":"Ejercicio2_Unidad3_B4","kind":"ej","label":"U3·B4·E2","grupo":"Unidad 3 · Bloque 4","orden":30402,"file":"Ejercicio2_Unidad3_B4.java","titulo":"Primos en un rango (bucles anidados)","enun":"Pide dos límites y dice, para cada número del rango, si es primo o compuesto.","tags":["Scanner","nextInt","int","boolean","while","bucle anidado","if-else","módulo %","bandera (flag)","número primo"],"kw":["primo","numeros primos entre dos numeros","rango","bucles anidados","while dentro de while","compuesto"],"code":"import java.util.Scanner;\n\npublic class Ejercicio2_Unidad3_B4 {\n    public static void main(String[] args) {\n        Scanner teclado = new Scanner(System.in);\n\n                // Límites del rango que escribe el usuario\n                int inferior;\n                int superior;\n\n                // Número que se está analizando en cada vuelta del bucle exterior\n                int numero;\n\n                // Bandera: true si el número actual es primo\n                boolean primo;\n\n                // Divisor que probamos en el bucle interior\n                int divisor;\n\n                // Pedimos los dos límites\n                System.out.print(\"Limite inferior: \");\n                inferior = teclado.nextInt();\n                System.out.print(\"Limite superior: \");\n                superior = teclado.nextInt();\n\n                // El contador del bucle exterior empieza en el límite inferior\n                numero = inferior;\n\n                // BUCLE EXTERIOR: una vuelta por cada número del rango (ambos incluidos)\n                while (numero <= superior) {\n\n                    // Para CADA número hay que reiniciar la bandera y el divisor,\n                    // porque el análisis del número anterior no sirve para este.\n                    // Los menores que 2 no son primos.\n                    primo = numero >= 2;\n                    divisor = 2;\n\n                    // BUCLE INTERIOR: busca un divisor, igual que en el ejercicio 1.\n                    // Se para en cuanto encuentra uno o al superar la raíz cuadrada.\n                    while (primo && divisor * divisor <= numero) {\n\n                        // Si divide exactamente, el número es compuesto\n                        if (numero % divisor == 0) {\n                            primo = false;\n                        }\n                        divisor++;\n                    }\n\n                    // Mostramos el resultado del número actual\n                    if (primo) {\n                        System.out.println(numero + \" -> primo\");\n                    } else {\n                        System.out.println(numero + \" -> compuesto\");\n                    }\n\n                    // Pasamos al siguiente número del rango.\n                    // Sin esta línea el bucle exterior sería infinito.\n                    numero++;\n                }\n                // Cerramos el Scanner\n        teclado.close();\n    }\n}\n","steps":[{"a":1,"b":1,"t":"Trae la clase Scanner al programa. Sin este import, Java no sabe qué es Scanner y da error.","base":true},{"a":3,"b":4,"t":"La clase se llama igual que el archivo. main es el punto de entrada: Java empieza a ejecutar aquí dentro.","base":true},{"a":5,"b":5,"t":"Crea el lector del teclado. System.in es la entrada estándar. El nombre teclado lo eliges tú.","base":true},{"a":15,"b":18,"t":"Variables: bandera de primo y divisor que se prueba.","base":false},{"a":21,"b":24,"t":"Se leen los dos límites del rango.","base":false},{"a":27,"b":27,"t":"El contador del bucle exterior empieza en el límite inferior.","base":false},{"a":30,"b":30,"t":"BUCLE EXTERIOR: una vuelta por cada número del rango, ambos incluidos.","base":false},{"a":35,"b":36,"t":"Para CADA número hay que reiniciar la bandera y el divisor: el análisis anterior no vale para este.","base":false},{"a":40,"b":46,"t":"BUCLE INTERIOR: igual que el ejercicio 1. Busca un divisor hasta la raíz cuadrada.","base":false},{"a":50,"b":53,"t":"Muestra el resultado del número actual.","base":false},{"a":58,"b":58,"t":"Pasa al siguiente número. Sin esta línea el bucle exterior sería infinito.","base":false},{"a":61,"b":61,"t":"Cierra el Scanner para liberar el recurso. Va al final.","base":true}],"ojo":null,"labelFull":"unidad 3 bloque 4 ejercicio 2"},{"id":"Ejercicio3_Unidad3_B4","kind":"ej","label":"U3·B4·E3","grupo":"Unidad 3 · Bloque 4","orden":30403,"file":"Ejercicio3_Unidad3_B4.java","titulo":"Tablas de multiplicar del 0 al 15 (do-while anidado)","enun":"Muestra la tabla de multiplicar (de 0 a 10) de los patrones 0 a 15, usando bucles do-while.","tags":["int","do-while","bucle anidado","tabla de multiplicar","concatenar texto"],"kw":["tabla de multiplicar","tablas","multiplicar","do while anidado","bucles anidados","sin scanner","del 0 al 15"],"code":"public class Ejercicio3_Unidad3_B4 {\n    public static void main(String[] args) {\n        // Número de patrón actual (de 1 a 15)\n        int numero;\n\n        // Multiplicador actual (de 0 a 10)\n        int multiplicador;\n\n        // BUCLE EXTERIOR: una vuelta por cada patrón.\n        // do...while ejecuta el cuerpo SIEMPRE al menos una vez y\n        // comprueba la condición AL FINAL. Como empezamos en 1 y\n        // sabemos que hay que generar al menos un patrón, encaja bien.\n        int patron = 0;\n        do {\n            System.out.println(\"Patron \" + patron);\n\n\n            // Reiniciamos el multiplicador en cada patrón: si no lo\n            // hiciéramos, el segundo patrón empezaría en 11 y no en 0.\n            multiplicador = 0;\n\n            // BUCLE INTERIOR: la tabla de multiplicar del patrón (0 a 10)\n            do {\n                System.out.println(patron + \" x \" + multiplicador + \" = \" + (patron * multiplicador));\n\n                // Avanzamos el multiplicador (si no, bucle infinito)\n                multiplicador++;\n            } while (multiplicador <= 10);\n\n            // Línea en blanco para separar un patrón del siguiente\n            System.out.println();\n\n            // Avanzamos al siguiente patrón\n            patron++;\n        } while (patron <= 15);\n    }\n}\n","steps":[{"a":1,"b":2,"t":"La clase se llama igual que el archivo. main es el punto de entrada: Java empieza a ejecutar aquí dentro.","base":true},{"a":13,"b":13,"t":"Contador del bucle exterior: el número de tabla actual.","base":false},{"a":14,"b":15,"t":"BUCLE EXTERIOR (do-while): ejecuta el cuerpo al menos una vez y comprueba la condición al final. Escribe el título de la tabla.","base":false},{"a":20,"b":20,"t":"Se reinicia el multiplicador en cada tabla; si no, la segunda tabla empezaría en 11.","base":false},{"a":23,"b":24,"t":"BUCLE INTERIOR: una línea de la tabla, tabla x multiplicador = resultado.","base":false},{"a":27,"b":27,"t":"Avanza el multiplicador; sin esto, bucle infinito.","base":false},{"a":28,"b":28,"t":"Repite mientras el multiplicador sea <= 10.","base":false},{"a":31,"b":31,"t":"Línea en blanco para separar una tabla de otra.","base":false},{"a":34,"b":34,"t":"Pasa a la siguiente tabla.","base":false},{"a":35,"b":35,"t":"Repite hasta la tabla 15. Recuerda el ; final.","base":false}],"ojo":"Este ejercicio no usa Scanner. Los comentarios dicen 'de 1 a 15' pero el bucle empieza en 0 (patron = 0). La variable numero está declarada y no se usa.","labelFull":"unidad 3 bloque 4 ejercicio 3"},{"id":"Ejercicio4_Unidad3_B4","kind":"ej","label":"U3·B4·E4","grupo":"Unidad 3 · Bloque 4","orden":30404,"file":"Ejercicio4_Unidad3_B4.java","titulo":"Pasar un número decimal a binario","enun":"Lee un valor entero y muestra su representación en binario dividiendo entre 2.","tags":["Scanner","nextInt","int","String","while","if","módulo %","binario","concatenar texto"],"kw":["binario","decimal a binario","dividir entre 2","restos","conversion","bits","base 2"],"code":"import java.util.Scanner;\n\npublic class Ejercicio4_Unidad3_B4 {\n    public static void main(String[] args) {\n        Scanner teclado = new Scanner(System.in);\n\n        // Valor que escribe el usuario\n        int valor;\n\n        // Copia del valor para ir dividiéndola sin perder el original,\n        // que necesitamos para mostrarlo al final\n        int resto_de_dividir;\n        int cociente;\n\n        // Aquí vamos construyendo el número binario como texto\n        String binario = \"\";\n\n        // Pedimos el valor\n        System.out.print(\"Valor introducido: \");\n        valor = teclado.nextInt();\n\n        // Trabajamos sobre una copia: \"cociente\" es lo que queda por dividir\n        cociente = valor;\n\n        // CASO ESPECIAL: el 0 no entraría en el bucle (0 > 0 es falso)\n        // y se quedaría con una cadena vacía, así que lo tratamos aparte\n        if (valor == 0) {\n            binario = \"0\";\n        }\n\n        // Dividimos entre 2 MIENTRAS quede algo por dividir\n        while (cociente > 0) {\n\n            // El resto de dividir entre 2 es siempre 0 o 1: es un bit\n            resto_de_dividir = cociente % 2;\n\n            // El PRIMER resto es el bit menos significativo (el de más a la derecha),\n            // así que cada nuevo resto se coloca DELANTE de lo que ya tenemos.\n            // Si lo pusiéramos detrás, el número saldría al revés.\n            binario = resto_de_dividir + binario;\n\n            // Dividimos entre 2 (división entera) para obtener el siguiente bit\n            cociente = cociente / 2;\n        }\n\n        // Mostramos el valor original y su representación en binario\n        System.out.println(\"Valor introducido: \" + valor);\n        System.out.println(\"Representacion binaria: \" + binario);\n\n        // Cerramos el Scanner\n        teclado.close();\n    }\n}\n","steps":[{"a":1,"b":1,"t":"Trae la clase Scanner al programa. Sin este import, Java no sabe qué es Scanner y da error.","base":true},{"a":3,"b":4,"t":"La clase se llama igual que el archivo. main es el punto de entrada: Java empieza a ejecutar aquí dentro.","base":true},{"a":5,"b":5,"t":"Crea el lector del teclado. System.in es la entrada estándar. El nombre teclado lo eliges tú.","base":true},{"a":12,"b":13,"t":"resto_de_dividir guarda cada bit (0 o 1) y cociente lo que queda por dividir.","base":false},{"a":16,"b":16,"t":"Aquí se va construyendo el binario como texto, empezando vacío.","base":false},{"a":19,"b":20,"t":"Se lee el valor.","base":false},{"a":23,"b":23,"t":"Se trabaja sobre una copia para conservar el original y mostrarlo al final.","base":false},{"a":27,"b":28,"t":"Caso especial: el 0 no entraría al while (0 > 0 es falso) y quedaría vacío.","base":false},{"a":32,"b":32,"t":"Se divide entre 2 mientras quede algo.","base":false},{"a":35,"b":35,"t":"El resto de dividir entre 2 es siempre 0 o 1: es un bit.","base":false},{"a":40,"b":40,"t":"El primer resto es el bit de más a la derecha, así que cada resto nuevo va DELANTE. Si se pusiera detrás, saldría al revés.","base":false},{"a":43,"b":43,"t":"División entera entre 2 para sacar el siguiente bit.","base":false},{"a":47,"b":48,"t":"Se muestra el original y su binario.","base":false},{"a":51,"b":51,"t":"Cierra el Scanner para liberar el recurso. Va al final.","base":true}],"ojo":null,"labelFull":"unidad 3 bloque 4 ejercicio 4"},{"id":"Ejercicio5_Unidad3_B4","kind":"ej","label":"U3·B4·E5","grupo":"Unidad 3 · Bloque 4","orden":30405,"file":"Ejercicio5_Unidad3_B4.java","titulo":"Factorial de un número","enun":"Lee n y calcula n! multiplicando n · (n-1) · … · 2.","tags":["Scanner","nextInt","int","long","while","acumulador","factorial"],"kw":["factorial","producto","multiplicar acumulando","n!","desbordamiento","long"],"code":"import java.util.Scanner;\n\npublic class Ejercicio5_Unidad3_B4 {\n    public static void main(String[] args) {\n        Scanner teclado = new Scanner(System.in);\n\n        // Número de pasos del secuenciador\n        int n;\n\n        // ACUMULADOR de un PRODUCTO: va guardando el resultado parcial.\n        // Empieza en 1 (y no en 0) porque 1 es el elemento neutro de la\n        // multiplicación: si empezara en 0, todo el resultado sería 0.\n        // Es long porque el factorial crece muy rápido y un int\n        // se desbordaría a partir de 13!\n        long factorial = 1;\n\n        // Contador que va bajando desde n hasta 2\n        int contador;\n\n        // Pedimos el número\n        System.out.print(\"Introduce el numero de pasos: \");\n        n = teclado.nextInt();\n\n        // Empezamos a multiplicar desde n\n        contador = n;\n\n        // Multiplicamos n * (n-1) * (n-2) * ... hasta llegar a 2.\n        // No hace falta multiplicar por 1 porque no cambia el resultado.\n        while (contador > 1) {\n            factorial = factorial * contador;   // acumulamos el producto\n            contador--;                         // pasamos al número anterior\n        }\n\n        // Mostramos el resultado.\n        // (Con n = 0 o n = 1 el bucle no se ejecuta y el resultado es 1,\n        // que es correcto: 0! = 1! = 1)\n        System.out.println(n + \"! = \" + factorial);\n\n        // Cerramos el Scanner\n        teclado.close();\n    }\n}\n","steps":[{"a":1,"b":1,"t":"Trae la clase Scanner al programa. Sin este import, Java no sabe qué es Scanner y da error.","base":true},{"a":3,"b":4,"t":"La clase se llama igual que el archivo. main es el punto de entrada: Java empieza a ejecutar aquí dentro.","base":true},{"a":5,"b":5,"t":"Crea el lector del teclado. System.in es la entrada estándar. El nombre teclado lo eliges tú.","base":true},{"a":15,"b":15,"t":"ACUMULADOR de un producto. Empieza en 1 (no en 0) porque 1 es neutro en la multiplicación; con 0 todo daría 0. Es long porque el factorial crece muy rápido y un int se desborda desde 13!.","base":false},{"a":18,"b":18,"t":"Contador que irá bajando desde n hasta 2.","base":false},{"a":21,"b":22,"t":"Se lee n.","base":false},{"a":25,"b":25,"t":"Se empieza a multiplicar desde n.","base":false},{"a":29,"b":29,"t":"Mientras contador > 1. No hace falta multiplicar por 1 porque no cambia nada.","base":false},{"a":30,"b":30,"t":"Se acumula el producto.","base":false},{"a":31,"b":31,"t":"Pasa al número anterior (n, n-1, n-2…). Sin esto sería infinito.","base":false},{"a":37,"b":37,"t":"Resultado. Con n = 0 o 1 el bucle no entra y sale 1, que es correcto.","base":false},{"a":40,"b":40,"t":"Cierra el Scanner para liberar el recurso. Va al final.","base":true}],"ojo":null,"labelFull":"unidad 3 bloque 4 ejercicio 5"},{"id":"Ejercicio1_Unidad3_B5","kind":"ej","label":"U3·B5·E1","grupo":"Unidad 3 · Bloque 5","orden":30501,"file":"Ejercicio1_Unidad3_B5.java","titulo":"Adivinar un número secreto","enun":"El programa elige un número al azar entre 1 y 100 y el usuario lo adivina con pistas de mayor o menor.","tags":["Scanner","nextInt","int","final (constante)","do-while","if","else if","contador","método","Math.random","número aleatorio"],"kw":["aleatorio","random","adivinar","numero al azar","juego","pistas","funcion","metodo","return","constante","intentos"],"code":"import java.util.Scanner;\n\npublic class Ejercicio1_Unidad3_B5 {\n    public static void main(String[] args) {\n        Scanner teclado = new Scanner(System.in);\n\n        // Rango en el que el programa elige el número secreto\n        final int MIN = 1;\n        final int MAX = 100;\n\n        // Número secreto que el usuario debe adivinar.\n        // Se genera UNA SOLA VEZ, antes del bucle. Si lo generáramos dentro,\n        // cambiaría en cada intento y sería imposible acertar.\n        int secreto = obtenerNumeroAzar(MIN, MAX);\n\n        // Número que escribe el usuario en cada intento\n        int intento;\n\n        // CONTADOR de intentos: suma 1 en cada vuelta\n        int intentos = 0;\n\n        System.out.println(\"He pensado un numero entre \" + MIN + \" y \" + MAX + \". Adivinalo.\");\n\n        // Usamos do...while porque el usuario tiene que escribir un número\n        // AL MENOS UNA VEZ, y la condición (haber acertado) solo se puede\n        // comprobar después de leer el intento.\n        do {\n            // Pedimos el intento\n            System.out.print(\"Tu numero --> \");\n            intento = teclado.nextInt();\n\n            // Contamos el intento\n            intentos++;\n\n            // Damos la pista según la comparación con el número secreto.\n            // OJO: la pista es sobre EL SECRETO, no sobre el intento:\n            // si el intento es menor que el secreto, el secreto es MAYOR.\n            if (intento < secreto) {\n                System.out.println(\"El numero secreto es MAYOR.\");\n            } else if (intento > secreto) {\n                System.out.println(\"El numero secreto es MENOR.\");\n            }\n\n            // Si no hay pista ni \"mayor\" ni \"menor\", es que ha acertado\n        } while (intento != secreto);\n\n        // Al salir del bucle, el usuario ha acertado\n        System.out.println(\"¡Correcto! El numero era \" + secreto\n                + \" y lo has adivinado en \" + intentos + \" intentos.\");\n\n        // Cerramos el Scanner\n        teclado.close();\n    }\n\n    // Devuelve un entero al azar entre min y max, AMBOS INCLUIDOS.\n    // Math.random() da un decimal en [0, 1). Al multiplicar por (max - min + 1)\n    // y truncar con (int), todos los valores del rango tienen la misma probabilidad.\n    public static int obtenerNumeroAzar(int min, int max) {\n        return (int) (Math.random() * (max - min + 1)) + min;\n    }\n}\n","steps":[{"a":1,"b":1,"t":"Trae la clase Scanner al programa. Sin este import, Java no sabe qué es Scanner y da error.","base":true},{"a":3,"b":4,"t":"La clase se llama igual que el archivo. main es el punto de entrada: Java empieza a ejecutar aquí dentro.","base":true},{"a":5,"b":5,"t":"Crea el lector del teclado. System.in es la entrada estándar. El nombre teclado lo eliges tú.","base":true},{"a":8,"b":9,"t":"final hace que el valor sea una constante: no se puede cambiar. Por convención va en MAYÚSCULAS.","base":false},{"a":14,"b":14,"t":"Se llama al método de abajo para generar el número. Se hace UNA sola vez antes del bucle: dentro cambiaría en cada intento y sería imposible acertar.","base":false},{"a":20,"b":20,"t":"Contador de intentos.","base":false},{"a":27,"b":30,"t":"do-while porque el usuario tiene que escribir al menos una vez, y acertar solo se puede comprobar después de leer.","base":false},{"a":33,"b":33,"t":"Cuenta el intento.","base":false},{"a":38,"b":41,"t":"La pista es sobre EL SECRETO: si el intento es menor que el secreto, el secreto es MAYOR. Si no hay pista, ha acertado.","base":false},{"a":45,"b":45,"t":"Repite mientras no acierte.","base":false},{"a":48,"b":49,"t":"Mensaje final con el secreto y los intentos.","base":false},{"a":52,"b":52,"t":"Cierra el Scanner para liberar el recurso. Va al final.","base":true},{"a":58,"b":59,"t":"Método: public static int = devuelve un entero. Recibe min y max. Math.random() da un decimal en [0, 1); se multiplica por (max - min + 1), se trunca con (int) y se suma min. Así entra entre min y max, ambos incluidos.","base":false}],"ojo":null,"labelFull":"unidad 3 bloque 5 ejercicio 1"},{"id":"Ejercicio2_Unidad3_B5","kind":"ej","label":"U3·B5·E2","grupo":"Unidad 3 · Bloque 5","orden":30502,"file":"Ejercicio2_Unidad3_B5.java","titulo":"Triángulo de Pascal","enun":"Pide el número de filas y dibuja el triángulo de Pascal centrado.","tags":["Scanner","nextInt","int","long","for","bucle anidado","printf","triángulo de Pascal"],"kw":["pascal","triangulo","bucles anidados","coeficientes binomiales","dibujar","piramide","formato"],"code":"import java.util.Scanner;\n\npublic class Ejercicio2_Unidad3_B5 {\n    public static void main(String[] args) {\n        Scanner teclado = new Scanner(System.in);\n\n        // Número de filas que escribe el usuario\n        int n;\n\n        // Fila actual (la fila 0 es la cúspide, con un solo 1)\n        int fila;\n\n        // Posición dentro de la fila actual (la posición 0 es el primer número)\n        int posicion;\n\n        // Valor de la casilla actual. Es long para que no se desborde\n        // con filas grandes (los números del triángulo crecen muy rápido).\n        long valor;\n\n        // Pedimos el número de filas\n        System.out.print(\"Indica el numero de filas: \");\n        n = teclado.nextInt();\n\n        // BUCLE EXTERIOR: una vuelta por cada fila, de la 0 a la n-1\n        for (fila = 0; fila < n; fila++) {\n\n            // Espacios iniciales para que el triángulo quede centrado.\n            // Cada número ocupa 6 caracteres (por el %6d), así que cada fila\n            // se desplaza la mitad (3 espacios) respecto a la anterior.\n            // Cuanto más arriba está la fila, más espacios lleva delante.\n            for (int espacios = 0; espacios < (n - fila - 1) * 3; espacios++) {\n                System.out.print(\" \");\n            }\n\n            // El primer número de CUALQUIER fila siempre es 1\n            valor = 1;\n\n            // BUCLE INTERIOR: la fila número \"fila\" tiene fila + 1 números\n            for (posicion = 0; posicion <= fila; posicion++) {\n\n                // Mostramos el valor actual con ancho fijo de 6 caracteres,\n                // alineado a la derecha. Así todas las columnas quedan rectas\n                // aunque los números tengan 1, 2, 3 o 4 cifras.\n                System.out.printf(\"%6d\", valor);\n\n                // Calculamos el SIGUIENTE número de la misma fila con la\n                // propiedad de los coeficientes binomiales:\n                //     C(fila, posicion + 1) = C(fila, posicion) * (fila - posicion) / (posicion + 1)\n                // Se multiplica ANTES de dividir para que la división sea exacta\n                // (con enteros, dividir antes truncaría decimales y daría resultados erróneos).\n                // Así no hace falta calcular factoriales, que se desbordarían enseguida.\n                valor = valor * (fila - posicion) / (posicion + 1);\n            }\n\n            // Salto de línea al terminar la fila\n            System.out.println();\n        }\n\n        // Cerramos el Scanner\n        teclado.close();\n    }\n}\n","steps":[{"a":1,"b":1,"t":"Trae la clase Scanner al programa. Sin este import, Java no sabe qué es Scanner y da error.","base":true},{"a":3,"b":4,"t":"La clase se llama igual que el archivo. main es el punto de entrada: Java empieza a ejecutar aquí dentro.","base":true},{"a":5,"b":5,"t":"Crea el lector del teclado. System.in es la entrada estándar. El nombre teclado lo eliges tú.","base":true},{"a":18,"b":18,"t":"Valor de cada casilla. long para que no se desborde con filas grandes.","base":false},{"a":21,"b":22,"t":"Se lee el número de filas.","base":false},{"a":25,"b":25,"t":"BUCLE EXTERIOR: una vuelta por fila, de la 0 (la cúspide) a la n-1.","base":false},{"a":31,"b":32,"t":"Espacios iniciales para centrar el triángulo. Cuanto más arriba la fila, más espacios. Cada número ocupa 6 caracteres (%6d), así que cada fila se desplaza 3 espacios.","base":false},{"a":36,"b":36,"t":"El primer número de cualquier fila siempre es 1.","base":false},{"a":39,"b":39,"t":"BUCLE INTERIOR: la fila número fila tiene fila + 1 números.","base":false},{"a":44,"b":44,"t":"%6d escribe el entero alineado a la derecha con ancho fijo de 6, para que las columnas queden rectas aunque tengan 1, 2, 3 o 4 cifras.","base":false},{"a":52,"b":52,"t":"Calcula el siguiente número de la fila con la fórmula de los coeficientes binomiales. Se multiplica ANTES de dividir para que la división sea exacta (con enteros dividir antes truncaría decimales). Así no hacen falta factoriales.","base":false},{"a":56,"b":56,"t":"Salto de línea al terminar cada fila.","base":false},{"a":60,"b":60,"t":"Cierra el Scanner para liberar el recurso. Va al final.","base":true}],"ojo":null,"labelFull":"unidad 3 bloque 5 ejercicio 2"},{"id":"Ejercicio1_Unidad4_B1","kind":"ej","label":"U4·B1·E1","grupo":"Unidad 4 · Bloque 1","orden":40101,"file":"Ejercicio1_Unidad4_B1.java","titulo":"Suma, media, mayor y menor de un array","enun":"Rellena un array de 100 enteros aleatorios (0-100), muéstralo y calcula suma, media, mayor y menor. Idea: un solo recorrido sirve para todo.","tags":["array","int","double","for","acumulador","máximo","mínimo","media","length","concatenar texto"],"kw":["array","arreglo","suma de un array","media de un array","mayor y menor","maximo","minimo","recorrer array","100 numeros"],"code":"import tutorial_java.utils;\n\npublic class Ejercicio1_Unidad4_B1 {\n\n    public static void main(String[] args) {\n\n        int[] numeros = new int[100];\n\n        // Rellenamos con tu método: número entre 0 y 100\n        for (int i = 0; i < numeros.length; i++) {\n            numeros[i] = utils.obtenerNumeroAzar();\n        }\n\n        int suma = 0;\n        // mayor y menor empiezan con el primer elemento (no con 0)\n        int mayor = numeros[0];\n        int menor = numeros[0];\n\n        System.out.println(\"Valores del array:\");\n\n        for (int i = 0; i < numeros.length; i++) {\n            System.out.print(numeros[i] + \" \");  // mostrar\n            suma += numeros[i];                  // acumular\n\n            if (numeros[i] > mayor) {\n                mayor = numeros[i];\n            }\n            if (numeros[i] < menor) {\n                menor = numeros[i];\n            }\n        }\n\n        // (double) evita que la división sea entera\n        double media = (double) suma / numeros.length;\n\n        System.out.println(\"\\n\\nSuma: \" + suma);\n        System.out.println(\"Media: \" + media);\n        System.out.println(\"Mayor: \" + mayor);\n        System.out.println(\"Menor: \" + menor);\n    }\n}\n","steps":[{"a":1,"b":1,"t":"Trae tu clase de utilidades (paquete tutorial_java). De ahí salen: obtenerNumeroAzar() → entero entre 0 y 100; obtenerNumeroAzar2(min, max) → entero entre min y max; pideNumeroEntero(mensaje) → pide un entero y repite hasta que escriban uno válido. Si no la tienes, mira la receta «Sustituir utils».","base":true},{"a":3,"b":5,"t":"La clase se llama igual que el archivo. main es el punto de entrada: Java empieza a ejecutar aquí dentro.","base":true},{"a":7,"b":7,"t":"Crea un array de 100 enteros: posiciones 0 a 99 (la última es length - 1, no 100). Al crearlo todas valen 0; el bucle siguiente las rellena.","base":false},{"a":10,"b":12,"t":"Rellenar: i recorre las posiciones 0..99 y numeros[i] = valor guarda un aleatorio en cada una. Se usa numeros.length en vez de 100 para que funcione aunque cambies el tamaño.","base":false},{"a":14,"b":17,"t":"Preparamos 3 variables antes del recorrido. suma empieza en 0 (neutro de la suma). mayor y menor empiezan con el PRIMER elemento y no con 0: si menor empezara en 0, ningún valor (0-100) sería menor y nunca se actualizaría.","base":false},{"a":19,"b":19,"t":"Título de la lista de valores.","base":true},{"a":21,"b":31,"t":"Un único recorrido hace tres cosas a la vez con el elemento numeros[i]: mostrarlo, sumarlo y compararlo con mayor y menor.","base":false},{"a":23,"b":23,"t":"Acumulador: suma = suma + valor actual. Al terminar el bucle tiene el total.","base":false},{"a":25,"b":27,"t":"Si el elemento actual es más grande que el mayor guardado hasta ahora, pasa a ser el nuevo mayor.","base":false},{"a":28,"b":30,"t":"Lo mismo al revés para el menor.","base":false},{"a":34,"b":34,"t":"media = suma / cantidad. (double) delante convierte la suma a decimal; sin él, int / int divide sin decimales (7 / 2 = 3) y perderías la parte decimal.","base":false},{"a":36,"b":39,"t":"\\n\\n baja dos líneas para separar los valores de los resultados. Se muestran las cuatro cifras calculadas.","base":false}],"ojo":"mayor y menor se inicializan con numeros[0], nunca con 0. Y para la media hay que convertir a double, o se trunca.","labelFull":"unidad 4 bloque 1 ejercicio 1"},{"id":"Ejercicio2_Unidad4_B1","kind":"ej","label":"U4·B1·E2","grupo":"Unidad 4 · Bloque 1","orden":40102,"file":"Ejercicio2_Unidad4_B1.java","titulo":"Array con valores entre dos límites","enun":"Pide un límite inferior y otro superior (si vienen al revés, los intercambia) y rellena un array de 100 enteros aleatorios dentro de ese rango.","tags":["array","int","for","if","intercambio de variables","número aleatorio","clase utils","concatenar texto"],"kw":["intercambiar variables","swap","rango","limites","aleatorio entre dos numeros","obtenerNumeroAzar2","import static","auxiliar"],"code":"import static tutorial_java.utils.*;\n\npublic class Ejercicio2_Unidad4_B1 {\n\n    public static void main(String[] args) {\n\n        int[] numeros = new int[100];\n\n        // pideNumeroEntero repite hasta que el usuario escribe un entero válido\n        tutorial_java.utils utils;\n        int inferior = pideNumeroEntero(\"Introduce el límite inferior:\");\n        int superior = pideNumeroEntero(\"Introduce el límite superior:\");\n\n        // Si los pone al revés, los intercambiamos\n        if (inferior > superior) {\n            int auxiliar = inferior;\n            inferior = superior;\n            superior = auxiliar;\n        }\n\n        // obtenerNumeroAzar2(min, max) devuelve un valor entre min y max\n        for (int i = 0; i < numeros.length; i++) {\n            numeros[i] = obtenerNumeroAzar2(inferior, superior);\n        }\n\n        System.out.println(\"Valores entre \" + inferior + \" y \" + superior + \":\");\n        for (int i = 0; i < numeros.length; i++) {\n            System.out.print(numeros[i] + \" \");\n        }\n        System.out.println();\n    }\n}\n","steps":[{"a":1,"b":1,"t":"Import estático: trae todos los métodos de utils para llamarlos SIN escribir «utils.» delante (pideNumeroEntero(...) en vez de utils.pideNumeroEntero(...)). Son los mismos: obtenerNumeroAzar2(min, max) y pideNumeroEntero(mensaje).","base":true},{"a":3,"b":5,"t":"La clase se llama igual que el archivo. main es el punto de entrada: Java empieza a ejecutar aquí dentro.","base":true},{"a":7,"b":7,"t":"Array de 100 enteros que se rellenará más abajo.","base":false},{"a":10,"b":10,"t":"Esta línea sobra: declara una variable sin usarla. Con el import static no hace falta. Puedes borrarla sin que cambie nada.","base":false},{"a":11,"b":12,"t":"Se piden los dos límites. pideNumeroEntero repite la pregunta hasta que se escribe un entero válido, así que no hace falta comprobar errores.","base":false},{"a":15,"b":19,"t":"Si el usuario los escribe al revés (inferior mayor que superior) se intercambian. Hacen falta TRES variables: guardas inferior en auxiliar, luego inferior = superior, y por último superior = auxiliar. Si hicieras solo inferior = superior; superior = inferior; ambas valdrían lo mismo.","base":false},{"a":22,"b":24,"t":"obtenerNumeroAzar2(inferior, superior) devuelve un aleatorio dentro del rango. Una vuelta por cada posición del array.","base":false},{"a":26,"b":30,"t":"Se muestran los límites y el array en una línea; el println() final salta de línea.","base":false}],"ojo":"Los límites se piden DESPUÉS de crear el array; da igual porque el array solo se rellena más abajo. La línea «tutorial_java.utils utils;» no hace nada.","labelFull":"unidad 4 bloque 1 ejercicio 2"},{"id":"Ejercicio3_Unidad4_B1","kind":"ej","label":"U4·B1·E3","grupo":"Unidad 4 · Bloque 1","orden":40103,"file":"Ejercicio3_Unidad4_B1.java","titulo":"Mostrar un array en orden normal e inverso","enun":"Rellena un array de 100 enteros y muéstralo primero de la posición 0 a la 99 y luego de la 99 a la 0, sin modificarlo.","tags":["array","for","recorrer al revés","length","int"],"kw":["orden inverso","al reves","dar la vuelta","recorrer hacia atras","decreciente","i--"],"code":"import tutorial_java.utils;\n\npublic class Ejercicio3_Unidad4_B1 {\n\n    public static void main(String[] args) {\n\n        int[] numeros = new int[100];\n\n        for (int i = 0; i < numeros.length; i++) {\n            numeros[i] = utils.obtenerNumeroAzar();\n        }\n\n        // 1) Orden normal: posición 0 hasta la 99\n        System.out.println(\"Orden normal:\");\n        for (int i = 0; i < numeros.length; i++) {\n            System.out.print(numeros[i] + \" \");\n        }\n\n        // 2) Orden inverso: empezamos en length - 1 (la última posición)\n        //    y bajamos hasta 0, ambos incluidos. El array no se modifica.\n        System.out.println(\"\\n\\nOrden inverso:\");\n        for (int i = numeros.length - 1; i >= 0; i--) {\n            System.out.print(numeros[i] + \" \");\n        }\n        System.out.println();\n    }\n}\n","steps":[{"a":1,"b":1,"t":"Trae tu clase de utilidades (paquete tutorial_java). De ahí salen: obtenerNumeroAzar() → entero entre 0 y 100; obtenerNumeroAzar2(min, max) → entero entre min y max; pideNumeroEntero(mensaje) → pide un entero y repite hasta que escriban uno válido. Si no la tienes, mira la receta «Sustituir utils».","base":true},{"a":3,"b":5,"t":"La clase se llama igual que el archivo. main es el punto de entrada: Java empieza a ejecutar aquí dentro.","base":true},{"a":7,"b":7,"t":"Crea un array de 100 enteros: posiciones 0 a 99 (la última es length - 1, no 100). Al crearlo todas valen 0; el bucle siguiente las rellena.","base":false},{"a":9,"b":11,"t":"Rellenar el array con aleatorios (0 a 100).","base":false},{"a":14,"b":17,"t":"Orden normal: i sube de 0 a 99 y se imprime numeros[i] separado por un espacio.","base":false},{"a":21,"b":21,"t":"\\n\\n cierra la línea anterior y deja una línea en blanco antes del título.","base":true},{"a":22,"b":22,"t":"El bucle al revés tiene 3 partes: empieza en length - 1 (la ÚLTIMA posición, 99), repite mientras i >= 0 (con >= se incluye la posición 0) y baja con i--. No se toca el array: solo se lee en otro orden.","base":false},{"a":23,"b":24,"t":"Mismo print que antes; solo cambia el orden en que i recorre las posiciones.","base":false}],"ojo":"Empezar en numeros.length (100) y no en length - 1 da ArrayIndexOutOfBoundsException: la posición 100 no existe.","labelFull":"unidad 4 bloque 1 ejercicio 3"},{"id":"Ejercicio4_Unidad4_B1","kind":"ej","label":"U4·B1·E4","grupo":"Unidad 4 · Bloque 1","orden":40104,"file":"Ejercicio4_Unidad4_B1.java","titulo":"Buscar un valor en un array","enun":"Rellena un array de 100 enteros, pide un número y muestra en qué posición está o avisa de que no aparece. Idea: recorre, compara y sal con break al primer acierto.","tags":["array","for-each","buscar en array","bandera (flag)","boolean","if-else","clase utils","concatenar texto"],"kw":["buscar","busqueda","encontrar","posicion de un valor","break","foreach","indice","esta en el array"],"code":"import tutorial_java.utils;\n\npublic class Ejercicio4_Unidad4_B1 {\n\n    public static void main(String[] args) {\n\n        // Array de 100 enteros (posiciones 0 a 99)\n        int[] numeros = new int[100];\n\n        // Rellenamos cada posición con un número aleatorio entre 0 y 100\n        for (int i = 0; i < numeros.length; i++) {\n            numeros[i] = utils.obtenerNumeroAzar();\n        }\n\n        // Mostramos el array: \"para cada numero dentro de numeros\"\n        System.out.println(\"Contenido del array:\");\n        for (int numero : numeros) {\n            System.out.print(numero + \" \");\n        }\n\n        // Pedimos el número a buscar (repite hasta que sea un entero válido)\n        int buscado = utils.pideNumeroEntero(\"\\n\\nIntroduce el número a buscar:\");\n\n        // foreach no da el índice, así que llevamos un contador de posición a mano\n        int posicion = 0;\n\n        // Bandera: indica si hemos encontrado el valor (empieza en \"no\")\n        boolean encontrado = false;\n\n        // Buscamos el valor recorriendo el array\n        for (int numero : numeros) {\n            if (numero == buscado) {\n                encontrado = true;   // lo hemos encontrado\n                break;               // salimos: basta con una aparición\n            }\n            posicion++;              // no coincide: pasamos a la siguiente posición\n        }\n\n        // Según la bandera, mostramos un mensaje u otro\n        if (encontrado) {\n            System.out.println(\"El valor \" + buscado + \" se encuentra en la posición \" + posicion + \".\");\n        } else {\n            System.out.println(\"El valor \" + buscado + \" no se ha encontrado en el array.\");\n        }\n    }\n}\n","steps":[{"a":1,"b":1,"t":"Trae tu clase de utilidades (paquete tutorial_java). De ahí salen: obtenerNumeroAzar() → entero entre 0 y 100; obtenerNumeroAzar2(min, max) → entero entre min y max; pideNumeroEntero(mensaje) → pide un entero y repite hasta que escriban uno válido. Si no la tienes, mira la receta «Sustituir utils».","base":true},{"a":3,"b":5,"t":"La clase se llama igual que el archivo. main es el punto de entrada: Java empieza a ejecutar aquí dentro.","base":true},{"a":8,"b":8,"t":"Array de 100 enteros (posiciones 0 a 99).","base":false},{"a":11,"b":13,"t":"Se rellena con aleatorios de 0 a 100.","base":false},{"a":17,"b":19,"t":"Primer for-each: muestra el contenido. Se lee «para cada numero dentro de numeros». Da el valor, no el índice.","base":false},{"a":22,"b":22,"t":"Pide el número a buscar (el \\n\\n del texto baja de línea tras el array).","base":false},{"a":25,"b":25,"t":"for-each no da el índice, así que lo contamos a mano. Empieza en 0 = la posición del primer elemento.","base":false},{"a":28,"b":28,"t":"Bandera: empieza en false («aún no») y pasa a true si lo encontramos. Al final decide qué mensaje mostrar.","base":false},{"a":31,"b":37,"t":"Segundo recorrido: ahora para buscar. Mira cada valor uno a uno.","base":false},{"a":32,"b":35,"t":"Si el valor coincide: se levanta la bandera y break sale del bucle ya (basta con la primera aparición).","base":false},{"a":36,"b":36,"t":"Solo se ejecuta si NO coincidió. Con break no llega aquí, así que al salir posicion vale justo el índice del acierto.","base":false},{"a":40,"b":44,"t":"Según la bandera: mensaje con la posición, o aviso de que no está. Las dos ramas cubren todos los casos.","base":false}],"ojo":"Solo informa de la PRIMERA aparición. posicion++ debe ir después del if: si lo pones antes, el resultado sale una posición de más.","labelFull":"unidad 4 bloque 1 ejercicio 4"},{"id":"Ejercicio5_Unidad4_B1","kind":"ej","label":"U4·B1·E5","grupo":"Unidad 4 · Bloque 1","orden":40105,"file":"Ejercicio5_Unidad4_B1.java","titulo":"Suma de los valores pares e impares","enun":"Recorre un array de 100 enteros y suma por separado los valores pares y los impares. Idea: dos acumuladores y un if-else dentro del recorrido.","tags":["array","for-each","acumulador","módulo %","par o impar","if-else","int"],"kw":["suma de pares","suma de impares","par impar","resto","modulo","dos acumuladores","valores pares"],"code":"import tutorial_java.utils;\n\npublic class Ejercicio5_Unidad4_B1 {\n\n    public static void main(String[] args) {\n\n        // Array de 100 enteros\n        int[] numeros = new int[100];\n\n        // Lo rellenamos con números aleatorios entre 0 y 100\n        for (int i = 0; i < numeros.length; i++) {\n            numeros[i] = utils.obtenerNumeroAzar();\n        }\n\n        // Acumuladores: empiezan en 0 y van sumando\n        int sumaPares = 0;\n        int sumaImpares = 0;\n\n        // Recorremos cada valor del array\n        for (int numero : numeros) {\n            // Si el resto de dividir entre 2 es 0, el VALOR es par\n            if (numero % 2 == 0) {\n                sumaPares += numero;\n            } else {\n                sumaImpares += numero;\n            }\n        }\n\n        // Mostramos las dos sumas\n        System.out.println(\"Suma de los valores pares: \" + sumaPares);\n        System.out.println(\"Suma de los valores impares: \" + sumaImpares);\n    }\n}\n","steps":[{"a":1,"b":1,"t":"Trae tu clase de utilidades (paquete tutorial_java). De ahí salen: obtenerNumeroAzar() → entero entre 0 y 100; obtenerNumeroAzar2(min, max) → entero entre min y max; pideNumeroEntero(mensaje) → pide un entero y repite hasta que escriban uno válido. Si no la tienes, mira la receta «Sustituir utils».","base":true},{"a":3,"b":5,"t":"La clase se llama igual que el archivo. main es el punto de entrada: Java empieza a ejecutar aquí dentro.","base":true},{"a":8,"b":8,"t":"Array de 100 enteros.","base":false},{"a":11,"b":13,"t":"Se rellena con aleatorios de 0 a 100.","base":false},{"a":16,"b":17,"t":"Dos acumuladores a 0, uno por cada tipo de valor.","base":false},{"a":20,"b":27,"t":"for-each: nos basta el valor, no hace falta el índice.","base":false},{"a":22,"b":23,"t":"% da el resto de dividir. Resto 0 al dividir entre 2 = el VALOR es par, y se suma a sumaPares.","base":false},{"a":24,"b":25,"t":"Si no es par es impar: se suma a sumaImpares. Cada valor va a una sola de las dos.","base":false},{"a":30,"b":31,"t":"Se muestran las dos sumas al terminar el recorrido.","base":false}],"ojo":"Aquí se mira si el VALOR es par (numero % 2). En el ejercicio 6 se mira la POSICIÓN. No los confundas.","labelFull":"unidad 4 bloque 1 ejercicio 5"},{"id":"Ejercicio6_Unidad4_B1","kind":"ej","label":"U4·B1·E6","grupo":"Unidad 4 · Bloque 1","orden":40106,"file":"Ejercicio6_Unidad4_B1.java","titulo":"Suma de los elementos en posiciones pares","enun":"Suma solo los elementos que ocupan posiciones pares (0, 2, 4…) de un array de 100 enteros. Idea: un for que salta de 2 en 2.","tags":["array","for","acumulador","int","length"],"kw":["posiciones pares","indices pares","saltar de 2 en 2","i += 2","suma por posicion","indice"],"code":"import tutorial_java.utils;\n\npublic class Ejercicio6_Unidad4_B1 {\n\n    public static void main(String[] args) {\n\n        // Array de 100 enteros\n        int[] numeros = new int[100];\n\n        // Lo rellenamos con números aleatorios entre 0 y 100\n        for (int i = 0; i < numeros.length; i++) {\n            numeros[i] = utils.obtenerNumeroAzar();\n        }\n\n        // Acumulador de la suma\n        int suma = 0;\n\n        // Aquí importa la POSICIÓN, no el valor.\n        // i += 2 salta de 2 en 2: posiciones 0, 2, 4, 6... hasta 98\n        for (int i = 0; i < numeros.length; i += 2) {\n            suma += numeros[i];   // sumamos el valor que hay en esa posición\n        }\n\n        // Mostramos el resultado\n        System.out.println(\"Suma de los elementos en posiciones pares: \" + suma);\n    }\n}\n","steps":[{"a":1,"b":1,"t":"Trae tu clase de utilidades (paquete tutorial_java). De ahí salen: obtenerNumeroAzar() → entero entre 0 y 100; obtenerNumeroAzar2(min, max) → entero entre min y max; pideNumeroEntero(mensaje) → pide un entero y repite hasta que escriban uno válido. Si no la tienes, mira la receta «Sustituir utils».","base":true},{"a":3,"b":5,"t":"La clase se llama igual que el archivo. main es el punto de entrada: Java empieza a ejecutar aquí dentro.","base":true},{"a":8,"b":8,"t":"Array de 100 enteros.","base":false},{"a":11,"b":13,"t":"Se rellena con aleatorios de 0 a 100.","base":false},{"a":16,"b":16,"t":"Acumulador a 0.","base":false},{"a":20,"b":22,"t":"Aquí importa la POSICIÓN, no el valor. i += 2 salta de dos en dos: 0, 2, 4… hasta 98 (la 99 queda fuera). Así no hace falta ningún if.","base":false},{"a":21,"b":21,"t":"Se suma el valor que hay en la posición i (no la i en sí).","base":false},{"a":25,"b":25,"t":"Muestra el resultado.","base":false}],"ojo":"Posición par ≠ valor par. La primera posición es la 0 (par). Si pidieran las impares, el for empezaría en i = 1.","labelFull":"unidad 4 bloque 1 ejercicio 6"},{"id":"Ejercicio1_Unidad4_B2","kind":"ej","label":"U4·B2·E1","grupo":"Unidad 4 · Bloque 2","orden":40201,"file":"Ejercicio1_Unidad4_B2.java","titulo":"Cambiar el signo de los impares (método)","enun":"Método que recibe un array y cambia el signo de los valores impares. En main: array de 120 enteros entre -50 y 50, mostrado antes y después.","tags":["array","método con array","for","for-each","módulo %","par o impar","método","int"],"kw":["metodo void","cambiar signo","negativo","impares","paso por referencia","modificar array en un metodo","-3 % 2","parametro array"],"code":"import tutorial_java.utils;\n\npublic class Ejercicio1_Unidad4_B2 {\n\n    // Recibe el array y lo modifica directamente (los arrays se pasan por referencia)\n    public static void cambiaSignoImpares(int[] array) {\n        for (int i = 0; i < array.length; i++) {\n            // OJO: en Java -3 % 2 da -1, no 1.\n            // Por eso se comprueba \"distinto de 0\" y no \"igual a 1\".\n            if (array[i] % 2 != 0) {\n                array[i] = -array[i];   // cambiamos el signo\n            }\n        }\n    }\n\n    // Muestra el array en una línea\n    public static void mostrar(int[] array) {\n        for (int numero : array) {\n            System.out.print(numero + \" \");\n        }\n        System.out.println();\n    }\n\n    public static void main(String[] args) {\n\n        int[] numeros = new int[120];\n\n        // Números entre -50 y 50\n        for (int i = 0; i < numeros.length; i++) {\n            numeros[i] = utils.obtenerNumeroAzar2(-50, 50);\n        }\n\n        System.out.println(\"Antes:\");\n        mostrar(numeros);\n\n        cambiaSignoImpares(numeros);\n\n        System.out.println(\"\\nDespués:\");\n        mostrar(numeros);\n    }\n}\n","steps":[{"a":1,"b":1,"t":"Trae tu clase de utilidades (paquete tutorial_java). De ahí salen: obtenerNumeroAzar() → entero entre 0 y 100; obtenerNumeroAzar2(min, max) → entero entre min y max; pideNumeroEntero(mensaje) → pide un entero y repite hasta que escriban uno válido. Si no la tienes, mira la receta «Sustituir utils».","base":true},{"a":3,"b":3,"t":"La clase se llama igual que el archivo. Primero van los métodos auxiliares y al final main, que los llama.","base":true},{"a":6,"b":14,"t":"Método: static (se llama desde main sin crear objeto), void (no devuelve nada) y recibe un int[]. Los arrays se pasan por referencia: el método trabaja sobre el MISMO array de main, así que lo modifica directamente y no hace falta return.","base":false},{"a":10,"b":10,"t":"Un impar tiene resto distinto de 0. Se compara con != 0 y no con == 1 porque en Java -3 % 2 vale -1: con == 1 los impares negativos no se detectarían.","base":false},{"a":11,"b":11,"t":"El - delante cambia el signo (5 pasa a -5 y -5 a 5). Se guarda en la misma posición.","base":false},{"a":17,"b":22,"t":"Método auxiliar que muestra un array en una línea. void: solo imprime, no devuelve nada. for (int numero : array) recorre cada valor sin necesitar índice; print (sin ln) deja todo en la misma línea y el println() final salta de línea. Se llama antes y después para comparar.","base":true},{"a":26,"b":26,"t":"Array de 120 enteros.","base":false},{"a":29,"b":31,"t":"Aleatorios entre -50 y 50: obtenerNumeroAzar2(-50, 50).","base":false},{"a":34,"b":34,"t":"Primero se muestra el array tal cual.","base":false},{"a":36,"b":36,"t":"Llamada al método. No se asigna a nada porque es void: el cambio ocurre dentro del array original.","base":false},{"a":38,"b":39,"t":"Se vuelve a mostrar el mismo array, ya modificado.","base":false}],"ojo":"Usa != 0, no == 1: en Java el resto de un número negativo impar es -1.","labelFull":"unidad 4 bloque 2 ejercicio 1"},{"id":"Ejercicio2_Unidad4_B2","kind":"ej","label":"U4·B2·E2","grupo":"Unidad 4 · Bloque 2","orden":40202,"file":"Ejercicio2_Unidad4_B2.java","titulo":"Array con el mayor de cada posición (método que devuelve array)","enun":"Método que recibe dos arrays de 100 enteros y devuelve un array NUEVO con el mayor de cada posición. Idea: recorre ambos a la vez con el mismo índice.","tags":["array","método con array","for","if-else","máximo","método","int"],"kw":["devolver un array","return array","comparar dos arrays","mayor de cada posicion","array nuevo","dos arrays","metodo con return"],"code":"import tutorial_java.utils;\n\npublic class Ejercicio2_Unidad4_B2 {\n\n    // Crea y devuelve un array nuevo con el mayor de cada posición\n    public static int[] creaArrayMayores(int[] a1, int[] a2) {\n        int[] resultado = new int[a1.length];   // mismo tamaño que los originales\n\n        for (int i = 0; i < a1.length; i++) {\n            if (a1[i] > a2[i]) {\n                resultado[i] = a1[i];\n            } else {\n                resultado[i] = a2[i];\n            }\n        }\n        return resultado;\n    }\n\n    public static void mostrar(int[] array) {\n        for (int numero : array) {\n            System.out.print(numero + \" \");\n        }\n        System.out.println();\n    }\n\n    public static void main(String[] args) {\n\n        int[] array1 = new int[100];\n        int[] array2 = new int[100];\n\n        // Rellenamos los dos arrays en el mismo bucle\n        for (int i = 0; i < array1.length; i++) {\n            array1[i] = utils.obtenerNumeroAzar();\n            array2[i] = utils.obtenerNumeroAzar();\n        }\n\n        int[] mayores = creaArrayMayores(array1, array2);\n\n        System.out.println(\"Array 1:\");\n        mostrar(array1);\n        System.out.println(\"\\nArray 2:\");\n        mostrar(array2);\n        System.out.println(\"\\nResultado:\");\n        mostrar(mayores);\n    }\n}\n","steps":[{"a":1,"b":1,"t":"Trae tu clase de utilidades (paquete tutorial_java). De ahí salen: obtenerNumeroAzar() → entero entre 0 y 100; obtenerNumeroAzar2(min, max) → entero entre min y max; pideNumeroEntero(mensaje) → pide un entero y repite hasta que escriban uno válido. Si no la tienes, mira la receta «Sustituir utils».","base":true},{"a":3,"b":3,"t":"La clase se llama igual que el archivo. Primero van los métodos auxiliares y al final main, que los llama.","base":true},{"a":6,"b":17,"t":"El tipo de retorno es int[]: el método devuelve un array. Recibe los dos arrays de entrada y no los modifica.","base":false},{"a":7,"b":7,"t":"Se crea el array nuevo con el mismo tamaño que los originales: una posición por cada comparación.","base":false},{"a":9,"b":9,"t":"Un solo índice i sirve para los dos arrays porque se comparan posición a posición.","base":false},{"a":10,"b":11,"t":"Si el de a1 es mayor, ese va al resultado.","base":false},{"a":12,"b":13,"t":"En otro caso gana a2 (si son iguales da lo mismo cuál se copia).","base":false},{"a":16,"b":16,"t":"Devuelve el array nuevo a quien llamó al método.","base":false},{"a":19,"b":24,"t":"Método auxiliar que muestra un array en una línea. void: solo imprime, no devuelve nada. for (int numero : array) recorre cada valor sin necesitar índice; print (sin ln) deja todo en la misma línea y el println() final salta de línea. Se llama antes y después para comparar.","base":true},{"a":28,"b":29,"t":"Dos arrays del mismo tamaño que el método espera.","base":false},{"a":32,"b":35,"t":"Se rellenan los dos en el mismo bucle; cada llamada a obtenerNumeroAzar da un valor distinto.","base":false},{"a":37,"b":37,"t":"Ahora el método SÍ devuelve algo, así que se guarda en una variable int[]. Los originales siguen intactos.","base":false},{"a":39,"b":44,"t":"Se muestran los dos originales y el resultado para comprobarlo a ojo.","base":false}],"ojo":"Los dos arrays deben tener el mismo tamaño o saldrá ArrayIndexOutOfBoundsException. Aquí no se modifica ningún original.","labelFull":"unidad 4 bloque 2 ejercicio 2"},{"id":"Ejercicio3_Unidad4_B2","kind":"ej","label":"U4·B2·E3","grupo":"Unidad 4 · Bloque 2","orden":40203,"file":"Ejercicio3_Unidad4_B2.java","titulo":"Aplicar un descuento a un array de precios","enun":"Método que aplica un porcentaje de descuento a cada precio de un array de 50 enteros (10-200). El porcentaje se repite hasta que esté entre 0 y 100.","tags":["array","método con array","for","do-while","int","método","acumulador"],"kw":["descuento","porcentaje","precios","validar entrada","repetir hasta","do while","division entera","truncar"],"code":"import tutorial_java.utils;\n\npublic class Ejercicio3_Unidad4_B2 {\n\n    // Aplica el descuento a cada precio del array\n    public static void aplicaDescuento(int[] precios, int porcentaje) {\n        for (int i = 0; i < precios.length; i++) {\n            // Multiplicamos ANTES de dividir para perder menos decimales\n            // (los int dividen sin decimales: el resultado se trunca).\n            // Ej: 100 con 20% -> 100 * 80 / 100 = 80\n            precios[i] = precios[i] * (100 - porcentaje) / 100;\n        }\n    }\n\n    public static void mostrar(int[] array) {\n        for (int numero : array) {\n            System.out.print(numero + \" \");\n        }\n        System.out.println();\n    }\n\n    public static void main(String[] args) {\n\n        int[] precios = new int[50];\n\n        // Precios entre 10 y 200\n        for (int i = 0; i < precios.length; i++) {\n            precios[i] = utils.obtenerNumeroAzar2(10, 200);\n        }\n\n        // Pedimos el porcentaje y repetimos si no está entre 0 y 100\n        int porcentaje;\n        do {\n            porcentaje = utils.pideNumeroEntero(\"Introduce el porcentaje de descuento (0-100):\");\n        } while (porcentaje < 0 || porcentaje > 100);\n\n        System.out.println(\"\\nPrecios antes:\");\n        mostrar(precios);\n\n        aplicaDescuento(precios, porcentaje);\n\n        System.out.println(\"\\nPrecios después:\");\n        mostrar(precios);\n    }\n}\n","steps":[{"a":1,"b":1,"t":"Trae tu clase de utilidades (paquete tutorial_java). De ahí salen: obtenerNumeroAzar() → entero entre 0 y 100; obtenerNumeroAzar2(min, max) → entero entre min y max; pideNumeroEntero(mensaje) → pide un entero y repite hasta que escriban uno válido. Si no la tienes, mira la receta «Sustituir utils».","base":true},{"a":3,"b":3,"t":"La clase se llama igual que el archivo. Primero van los métodos auxiliares y al final main, que los llama.","base":true},{"a":6,"b":13,"t":"Método void: modifica el array de precios directamente (los arrays se pasan por referencia).","base":false},{"a":11,"b":11,"t":"Fórmula: precio × (100 − porcentaje) / 100. Con 20 % de 100 → 100 × 80 / 100 = 80. Se multiplica ANTES de dividir: si calculases (100 − porcentaje) / 100 primero, 80 / 100 = 0 en enteros y todos los precios saldrían 0.","base":false},{"a":15,"b":20,"t":"Método auxiliar que muestra un array en una línea. void: solo imprime, no devuelve nada. for (int numero : array) recorre cada valor sin necesitar índice; print (sin ln) deja todo en la misma línea y el println() final salta de línea. Se llama antes y después para comparar.","base":true},{"a":24,"b":24,"t":"50 precios.","base":false},{"a":27,"b":29,"t":"Precios aleatorios entre 10 y 200.","base":false},{"a":32,"b":32,"t":"Se declara FUERA del do-while para que la condición del while también pueda verlo (una variable declarada dentro de
