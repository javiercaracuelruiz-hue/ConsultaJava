<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chuleta Java</title>
<style>
/* Layout: barra de búsqueda fija arriba; lista de resultados a la izquierda; detalle (código + pasos) a la derecha. */
:root {
  --bg: #EDEFF2;
  --panel: #FFFFFF;
  --panel-2: #E3E7ED;
  --ink: #161A20;
  --muted: #566070;
  --line: #D2D8E0;
  --accent: #B93A0E;
  --accent-ink: #FFFFFF;
  --accent-soft: #FBE8DF;
  --mark: #FFE58A;
  --warn-bg: #FFF3D1;
  --warn-line: #E3BF58;
  --warn-ink: #5A4200;
  --code-bg: #12171E;
  --code-fg: #D7DEE8;
  --code-dim: #6F7B8B;
  --code-bar: #FF9A52;
  --code-k: #C79BFF;
  --code-s: #9BD7A4;
  --code-c: #8793A3;
  --code-n: #F2B66B;
  --code-t: #7CC4F5;
  --code-f: #E8D58F;
  --code-hl: rgba(255, 196, 77, .17);
  --code-mark: rgba(255, 213, 79, .38);
  --code-line: #262E39;
  --font-ui: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-code: ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1217; --panel: #161B22; --panel-2: #212831; --ink: #E7EBF0; --muted: #98A2B0; --line: #2A323D;
    --accent: #FF8A4C; --accent-ink: #1A0D05; --accent-soft: #2A1A11; --mark: #5B4B0E;
    --warn-bg: #2B2410; --warn-line: #6B5A1C; --warn-ink: #F2D98A;
    --code-bg: #0A0D11; --code-line: #1E252E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1217; --panel: #161B22; --panel-2: #212831; --ink: #E7EBF0; --muted: #98A2B0; --line: #2A323D;
  --accent: #FF8A4C; --accent-ink: #1A0D05; --accent-soft: #2A1A11; --mark: #5B4B0E;
  --warn-bg: #2B2410; --warn-line: #6B5A1C; --warn-ink: #F2D98A;
  --code-bg: #0A0D11; --code-line: #1E252E;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 var(--font-ui);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 40px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1480px; margin: 0 auto; }

/* ---- cabecera y búsqueda ---- */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 18px; }
.top h1 { margin: 0; font-size: 22px; letter-spacing: -.02em; line-height: 1.15; }
.top p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 11px; font-size: 13px; line-height: 1.2; }
.btn:hover { border-color: var(--accent); }
.searchwrap { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); padding-block: 12px 10px; }
.search { position: relative; }
.search input {
  width: 100%; height: 54px; border: 2px solid var(--line); background: var(--panel); color: var(--ink);
  border-radius: 12px; padding: 0 56px 0 18px; font: 500 18px var(--font-ui);
}
.search input::placeholder { color: var(--muted); font-weight: 400; }
.search input:focus { outline: none; border-color: var(--accent); }
.search kbd, .search .clear {
  position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
}
.search kbd { font: 12px var(--font-code); border: 1px solid var(--line); border-radius: 5px; padding: 1px 7px; color: var(--muted); background: var(--panel-2); pointer-events: none; }
.search .clear { border: 0; background: var(--panel-2); width: 28px; height: 28px; border-radius: 6px; font-size: 16px; line-height: 1; color: var(--muted); }
.quick { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; align-items: center; }
.quick span { font-size: 12px; color: var(--muted); margin-right: 2px; }
.chip {
  border: 1px solid var(--line); background: var(--panel); border-radius: 7px; padding: 3px 9px;
  font-size: 13px; line-height: 1.4; color: var(--ink);
}
.chip:hover { border-color: var(--accent); color: var(--accent); }
.chip b { font-weight: 600; color: var(--muted); margin-left: 4px; font-size: 12px; }

/* ---- layout ---- */
.layout { display: grid; grid-template-columns: 350px minmax(0, 1fr); gap: 20px; align-items: start; margin-top: 6px; }
.lista { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 96px); max-height: calc(100vh - 112px); overflow: auto; padding-right: 4px; min-width: 0; }
.seg { display: flex; gap: 4px; background: var(--panel-2); padding: 3px; border-radius: 9px; margin-bottom: 10px; }
.seg button { flex: 1; border: 0; background: transparent; border-radius: 7px; padding: 5px 6px; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.sec { margin: 14px 2px 6px; font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; display: flex; justify-content: space-between; }
.sec:first-child { margin-top: 2px; }
.cards { display: flex; flex-direction: column; gap: 6px; }
.card {
  display: block; width: 100%; text-align: left; background: var(--panel); border: 1px solid var(--line);
  border-radius: 10px; padding: 10px 12px; min-width: 0;
}
.card:hover { border-color: var(--accent); }
.card[aria-current="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.card .row { display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.badge { flex: none; font: 600 11px var(--font-code); background: var(--panel-2); color: var(--ink); border-radius: 5px; padding: 1px 6px; }
.badge.rec { background: var(--accent); color: var(--accent-ink); font-family: var(--font-ui); letter-spacing: .02em; }
.card .t { font-weight: 600; font-size: 14px; line-height: 1.3; }
.card .d { margin: 4px 0 0; color: var(--muted); font-size: 13px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .hits { margin: 6px 0 0; display: flex; flex-direction: column; gap: 1px; }
.card .hit { font: 12px/1.5 var(--font-code); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .hit i { font-style: normal; color: var(--accent); margin-right: 6px; }
.card.mini { padding: 7px 10px; }
.card.mini .t { font-weight: 500; }
mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }
.aprox { background: var(--warn-bg); border: 1px solid var(--warn-line); color: var(--warn-ink); border-radius: 8px; padding: 7px 10px; font-size: 13px; margin-bottom: 8px; }
.vacio { color: var(--muted); padding: 18px 4px; font-size: 14px; }

/* ---- detalle ---- */
.detalle { min-width: 0; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
.back { display: none; margin-bottom: 12px; }
.dhead h2 { margin: 6px 0 4px; font-size: 25px; line-height: 1.2; letter-spacing: -.02em; text-wrap: balance; }
.dhead .meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.dhead .meta small { color: var(--muted); font-size: 13px; }
.dhead p { margin: 4px 0 0; max-width: 70ch; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.ojo { margin-top: 14px; background: var(--warn-bg); border: 1px solid var(--warn-line); color: var(--warn-ink); border-radius: 10px; padding: 10px 14px; font-size: 14px; max-width: 90ch; }
.ojo strong { margin-right: 4px; }
.dgrid { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(300px, .9fr); gap: 18px; margin-top: 18px; align-items: start; }
.codebox { background: var(--code-bg); color: var(--code-fg); border-radius: 12px; overflow: hidden; min-width: 0; }
.codebar { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 10px 8px 14px; border-bottom: 1px solid var(--code-line); font: 12.5px var(--font-code); color: var(--code-dim); }
.codebar .btn { background: transparent; color: var(--code-fg); border-color: #3a4452; font-family: var(--font-ui); }
.codebar .btn:hover { border-color: var(--code-bar); color: var(--code-bar); }
.code { position: relative; max-height: 68vh; overflow: auto; padding: 10px 0; font: 13.5px/1.62 var(--font-code); }
.ln { display: flex; min-width: max-content; padding-right: 16px; border-left: 3px solid transparent; }
.ln .no { flex: none; width: 3.4ch; text-align: right; padding-right: 14px; color: var(--code-dim); user-select: none; padding-left: 6px; font-variant-numeric: tabular-nums; }
.ln .tx { white-space: pre; }
.ln.on { background: var(--code-hl); border-left-color: var(--code-bar); }
.code .k { color: var(--code-k); } .code .s { color: var(--code-s); } .code .c { color: var(--code-c); font-style: italic; }
.code .n { color: var(--code-n); } .code .t { color: var(--code-t); } .code .f { color: var(--code-f); }
.code mark { background: var(--code-mark); color: inherit; }
.salida { margin-top: 12px; }
.salida h4, .stepsbox h3 { margin: 0 0 6px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.salida pre { margin: 0; background: var(--panel-2); border-radius: 10px; padding: 10px 14px; font: 13px/1.55 var(--font-code); overflow: auto; }
.stepsbox { min-width: 0; }
.stepshead { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
.stepshead label { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; cursor: pointer; }
.stepshead h3 { margin: 0; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.step {
  display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--panel);
  border-radius: 10px; padding: 9px 12px; font-size: 14px; line-height: 1.5;
}
.step:hover { border-color: var(--accent); }
.step[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.step .rg { display: block; margin-bottom: 2px; font: 600 11.5px var(--font-code); color: var(--accent); }
.step.base .rg::after { content: " · básico"; color: var(--muted); font-weight: 400; }
.step.base { color: var(--muted); }
.hide-base .step.base { display: none; }
.rel { margin-top: 20px; }
.rel h3 { margin: 0 0 8px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.relgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }

/* ---- inicio ---- */
.hero h2 { margin: 0 0 6px; font-size: 26px; letter-spacing: -.02em; text-wrap: balance; }
.hero > p { margin: 0 0 18px; color: var(--muted); max-width: 66ch; }
.mapa { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px 24px; }
.mapa h3 { margin: 0 0 8px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.mapa .tags { margin-top: 0; }
.ejemplos { display: grid; gap: 6px; margin: 0 0 22px; padding: 0; list-style: none; max-width: 60ch; }
.ejemplos li { display: flex; gap: 10px; align-items: baseline; color: var(--muted); font-size: 14px; }
.ejemplos button { border: 0; background: none; padding: 0; text-align: left; font: 600 14px var(--font-code); color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }

@media (max-width: 1180px) {
  .dgrid { grid-template-columns: minmax(0, 1fr); }
  .code { max-height: 56vh; }
}
@media (max-width: 900px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .lista { position: static; max-height: none; padding-right: 0; }
  .layout.show-detail .lista { display: none; }
  .layout:not(.show-detail) .detalle { display: none; }
  .back { display: inline-block; }
  .panel { padding: 14px; }
  .dhead h2 { font-size: 21px; }
  .top p { display: none; }
  .searchwrap.hasq .quick { display: none; }
}
@media (prefers-reduced-motion: no-preference) {
  .card, .step, .chip, .btn { transition: border-color .12s, background-color .12s; }
}
</style>
</head>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Chuleta Java</h1>
      <p id="sub"></p>
    </div>
    <button class="btn" id="tema" type="button" aria-label="Cambiar tema claro u oscuro">Tema</button>
  </header>

  <div class="searchwrap">
    <div class="search">
      <input id="q" type="search" autocomplete="off" spellcheck="false" aria-label="Buscar ejercicios o preguntar cómo se hace algo"

      <kbd id="kbd">/</kbd>
      <button class="clear" id="clear" type="button" aria-label="Borrar búsqueda" hidden>×</button>

    <div class="quick" id="quick"></div>

  <main class="layout" id="layout">
    <aside class="lista" id="lista" aria-label="Resultados">
      <div class="seg" id="seg" role="group" aria-label="Filtrar por tipo">

      <div id="results"></div>

  </main>
</div>

<script>
const DATA = {"items":[{"id":"Ejercicio1_Unidad_1","kind":"ej","label":"U1·E1","grupo":"Unidad 1","orden":10001,"file":"Ejercicio1_Unidad_1.java","titulo":"Leer un entero, un float y un double","enun":"Pide un número entero, uno decimal (float) y otro decimal (double) y los muestra juntos en una sola línea.","tags":["Scanner","nextInt","nextFloat","nextDouble","int","float","double","print / println","concatenar texto"],"kw":["leer datos del teclado","pedir numero","tipos de datos","declarar variables","entrada de datos","variables"],"code":"import java.util.Scanner;\n\npublic class Ejercicio1_Unidad_1 {\n\n    public static void main(String[] args) {\n\n        // Indicamos las variables y el tipo del ejercicio\n\n        Scanner teclado = new Scanner(System.in);\n\n        int numeroEntero;\n        float numeroFloat;\n        double numeroDouble;\n\n        //Lo que ponemos a continuacion es lo que indicara al usuario que tiene que poner y los datos que recogera.\n\n        System.out.println(\"Introduce un numero entero: \");\n        numeroEntero = teclado.nextInt();\n\n        System.out.println(\"Introduce un numero decimal: \");\n        numeroFloat = teclado.nextFloat();\n\n        System.out.print(\"Introduce un número decimal : \");\n        numeroDouble = teclado.nextDouble();\n\n        //Esto es para que los 3 numero salgan en la misma linea y no en diferentes\n\n        System.out.println(\"Números introducidos: \" + numeroEntero + \" \" + numeroFloat + \" \" + numeroDouble);\n        teclado.close();\n\n    }\n}\n","steps":[{"a":1,"b":1,"t":"Trae la clase Scanner al programa. Sin este import, Java no sabe qué es Scanner y da error.","base":true},{"a":3,"b":5,"t":"La clase se llama igual que el archivo. main es el punto de entrada: Java empieza a ejecutar aquí dentro.","base":true},{"a":9,"b":9,"t":"Crea el lector del teclado. System.in es la entrada estándar. El nombre teclado lo eliges tú.","base":true},{"a":11,"b":13,"t":"Declaramos las 3 variables: tipo + nombre. int guarda enteros, float decimales de precisión normal y double decimales con más precisión.","base":false},{"a":17,"b":18,"t":"Primero un mensaje para el usuario (println salta de línea) y después se lee con nextInt() y se guarda en la variable con =.","base":false},{"a":20,"b":24,"t":"Mismo patrón con otros tipos: cada tipo tiene su lector (nextFloat, nextDouble). El último usa print, sin ln, así que el cursor se queda en la misma línea.","base":false},{"a":28,"b":28,"t":"Se unen texto y variables con +. Los \" \" del medio son espacios para que los números no salgan pegados.","base":false},{"a":29,"b":29,"t":"Cierra el Scanner para liberar el recurso. Va al final.","base":true}],"ojo":"Si Windows está en español, el Scanner espera los decimales con COMA (3,5) y no con punto. Si escribes 3.5 da InputMismatchException.","labelFull":"unidad 1 ejercicio 1"},{"id":"Ejercicio2_Unidad1","kind":"ej","label":"U1·E2","grupo":"Unidad 1","orden":10002,"file":"Ejercicio2_Unidad1.java","titulo":"Leer tres datos y mostrar cada uno al momento","enun":"Igual que el anterior, pero después de pedir cada dato lo muestra enseguida.","tags":["Scanner","nextInt","nextFloat","nextDouble","int","float","double","print / println","concatenar texto"],"kw":["leer datos del teclado","pedir numero","mostrar lo introducido","eco","tipos de datos"],"code":"import java.util.Scanner;\n\npublic class Ejercicio2_Unidad1 {\n    public static void main(String[] args) {\n\n        // Creamos el objeto Scanner para leer datos del teclado\n        Scanner teclado = new Scanner(System.in);\n\n        // Indicamos las variables y el tipo de cada una\n        int numeroEntero;\n        float numeroFloat;\n        double numeroDouble;\n\n        // Pedimos el entero y lo mostramos justo después de introducirlo\n        System.out.println(\"Introduce un número entero: \");\n        numeroEntero = teclado.nextInt();\n        System.out.println(\"Has introducido el entero: \" + numeroEntero);\n\n        // Pedimos el float y lo mostramos justo después de introducirlo\n        System.out.println(\"Introduce un número decima: \");\n        numeroFloat = teclado.nextFloat();\n        System.out.println(\"Has introducido el float: \" + numeroFloat);\n\n        // Pedimos el double y lo mostramos justo después de introducirlo\n        System.out.println(\"Introduce un número decimal: \");\n        numeroDouble = teclado.nextDouble();\n        System.out.println(\"Has introducido el double: \" + numeroDouble);\n\n        teclado.close();\n\n\n    }\n\n}\n","steps":[{"a":1,"b":1,"t":"Trae la clase Scanner al programa. Sin este import, Java no sabe qué es Scanner y da error.","base":true},{"a":3,"b":4,"t":"La clase se llama igual que el archivo. main es el punto de entrada: Java empieza a ejecutar aquí dentro.","base":true},{"a":7,"b":7,"t":"Crea el lector del teclado. System.in es la entrada estándar. El nombre teclado lo eliges tú.","base":true},{"a":10,"b":12,"t":"Tres variables de tipos distintos: int, float y double.","base":false},{"a":15,"b":17,"t":"Patrón pedir, leer, mostrar: mensaje, nextInt() guarda el valor y se imprime justo después concatenando con +.","base":false},{"a":20,"b":22,"t":"Lo mismo con el float, usando nextFloat().","base":false},{"a":25,"b":27,"t":"Lo mismo con el double, usando nextDouble().","base":false},{"a":29,"b":29,"t":"Cierra el Scanner para liberar el recurso. Va al final.","base":true}],"ojo":"El mensaje del float dice \"decima\" (falta la l). Solo es el texto, no afecta al programa. Si Windows está en español, el Scanner espera los decimales con COMA (3,5) y no con punto. Si escribes 3.5 da InputMismatchException.","labelFull":"unidad 1 ejercicio 2"},{"id":"Ejercicio3_Unidad1","kind":"ej","label":"U1·E3","grupo":"Unidad 1","orden":10003,"file":"Ejercicio3_Unidad1.java","titulo":"Suma de tres números","enun":"Lee tres números y muestra su suma.","tags":["Scanner","nextDouble","double","aritméticos","print / println","concatenar texto"],"kw":["sumar","suma de tres numeros","operaciones basicas","resultado"],"code":"import java.util.Scanner;\n\npublic class Ejercicio3_Unidad1 {\n\n    public static void main(String[] args) {\n\n        // Creamos el objeto Scanner para leer datos del teclado\n        Scanner teclado = new Scanner(System.in);\n\n        // Variables que introduce el usuario\n        double primeroNumero;\n        double segundoNumero;\n        double terceroNumero;\n\n        // Variable para almacenar el resultado\n        double suma;\n\n        // Pedimos los tres números\n        System.out.print(\"Introduce el primer número: \");\n        primeroNumero = teclado.nextDouble();\n\n        System.out.print(\"Introduce el segundo número: \");\n        segundoNumero = teclado.nextDouble();\n\n        System.out.print(\"Introduce el tercer número: \");\n        terceroNumero = teclado.nextDouble();\n\n        // Suma de los tres valores\n        suma = primeroNumero + segundoNumero + terceroNumero;\n\n        System.out.println(\"La suma de los tres números es: \" + suma);\n\n\n        teclado.close();\n    }\n}\n","steps":[{"a":1,"b":1,"t":"Trae la clase Scanner al programa. Sin este import, Java no sabe qué es Scanner y da error.","base":true},{"a":3,"b":5,"t":"La clase se llama igual que el archivo. main es el punto de entrada: Java empieza a ejecutar aquí dentro.","base":true},{"a":8,"b":8,"t":"Crea el lector del teclado. System.in es la entrada estándar. El nombre teclado lo eliges tú.","base":true},{"a":11,"b":13,"t":"Los tres datos que escribe el usuario. double para admitir decimales.","base":false},{"a":16,"b":16,"t":"Variable aparte para guardar el resultado. Separar entradas y resultado hace el programa más fácil de leer.","base":false},{"a":19,"b":26,"t":"Se pide y se lee cada número. Aquí se usa print (sin ln) para que el usuario escriba justo a continuación del mensaje.","base":false},{"a":29,"b":29,"t":"La suma se calcula con + y se guarda en la variable suma.","base":false},{"a":31,"b":31,"t":"Se muestra el texto y la variable unidos con +.","base":false},{"a":34,"b":34,"t":"Cierra el Scanner para liberar el recurso. Va al final.","base":true}],"ojo":"Si Windows está en español, el Scanner espera los decimales con COMA (3,5) y no con punto. Si escribes 3.5 da InputMismatchException.","labelFull":"unidad 1 ejercicio 3"},{"id":"Ejercicio4_Unidad1","kind":"ej","label":"U1·E4","grupo":"Unidad 1","orden":10004,"file":"Ejercicio4_Unidad1.java","titulo":"Índice de masa corporal (IMC)","enun":"Pide peso en kg y altura en metros y calcula el IMC = peso / altura², mostrado con 2 decimales.","tags":["Scanner","nextDouble","double","aritméticos","Math.pow","printf"],"kw":["imc","indice de masa corporal","formula","peso y altura","potencia","elevar al cuadrado","dos decimales","decimales"],"code":"import java.util.Scanner;\n\npublic class Ejercicio4_Unidad1 {\n\n    public static void main(String[] args) {\n\n        // Creamos el objeto Scanner para leer datos del teclado\n        Scanner teclado = new Scanner(System.in);\n\n        // Variables que introduce el usuario\n        double pesoKg;\n        double alturaMetros;\n\n        // Variable para almacenar el resultado\n        double imc;\n\n        // Pedimos el peso en kilogramos\n        System.out.println(\"Introduce tu peso en kg: \");\n        pesoKg = teclado.nextDouble();\n\n        // Pedimos la altura en metros\n        System.out.println(\"Introduce tu altura en metros: \");\n        alturaMetros = teclado.nextDouble();\n\n        // Aplicamos la fórmula: IMC = peso / altura al cuadrado\n        imc = pesoKg / Math.pow(alturaMetros, 2);\n\n        // Mostramos el resultado con 2 decimales\n        System.out.printf(\"Tu IMC es: %.2f%n\" + imc);\n\n        teclado.close();\n    }\n}\n","steps":[{"a":1,"b":1,"t":"Trae la clase Scanner al programa. Sin este import, Java no sabe qué es Scanner y da error.","base":true},{"a":3,"b":5,"t":"La clase se llama igual que el archivo. main es el punto de entrada: Java empieza a ejecutar aquí dentro.","base":true},{"a":8,"b":8,"t":"Crea el lector del teclado. System.in es la entrada estándar. El nombre teclado lo eliges tú.","base":true},{"a":11,"b":12,"t":"Datos de entrada, en double porque llevan decimales (72.5 kg, 1.78 m).","base":false},{"a":15,"b":15,"t":"Variable para el resultado.","base":false},{"a":18,"b":23,"t":"Se pide y se lee cada dato con nextDouble().","base":false},{"a":26,"b":26,"t":"Math.pow(base, exponente) eleva un número a una potencia: aquí altura al cuadrado. Después se divide el peso entre ese resultado.","base":false},{"a":29,"b":29,"t":"printf muestra con formato: %.2f significa 'número decimal con 2 decimales' y %n es el salto de línea. Los valores van DESPUÉS de una coma.","base":false},{"a":31,"b":31,"t":"Cierra el Scanner para liberar el recurso. Va al final.","base":true}],"ojo":"Esta línea falla al ejecutarse: printf(\"Tu IMC es: %.2f%n\" + imc) une imc al texto con +, así que %.2f se queda sin valor y salta MissingFormatArgumentException. Lo correcto es poner una coma: System.out.printf(\"Tu IMC es: %.2f%n\", imc);","labelFull":"unidad 1 ejercicio 4"},{"id":"Ejercicio5_Unidad1","kind":"ej","label":"U1·E5","grupo":"Unidad 1","orden":10005,"file":"Ejercicio5_Unidad1.java","titulo":"Media de tres números","enun":"Lee tres números y muestra su media con 2 decimales.","tags":["Scanner","nextDouble","double","aritméticos","media","printf"],"kw":["promedio","media de tres numeros","dividir","dos decimales","parentesis"],"code":"import java.util.Scanner;\n\npublic class Ejercicio5_Unidad1 {\n\n    public static void main(String[] args) {\n\n        // Creamos el objeto Scanner para leer datos del teclado\n        Scanner teclado = new Scanner(System.in);\n\n        // Variables que introduce el usuario\n        double primerNumero;\n        double segundoNumero;\n        double tercerNumero;\n\n        // Variable para almacenar el resultado\n        double media;\n\n        // Pedimos los tres números\n        System.out.println(\"Introduce el primer número: \");\n        primerNumero = teclado.nextDouble();\n\n        System.out.println(\"Introduce el segundo número: \");\n        segundoNumero = teclado.nextDouble();\n\n        System.out.println(\"Introduce el tercer número: \");\n        tercerNumero = teclado.nextDouble();\n\n        // Media = suma de los números / cantidad de números\n        media = (primerNumero + segundoNumero + tercerNumero) / 3;\n\n        // Mostramos el resultado con 2 decimales\n        // %.2f%n Esta variable lo que representa es que solo muestre 2 decimales (%.2f%) \\n\n        System.out.printf(\"La media de los tres números es: %.2f%n\" + media);\n\n        teclado.close();\n\n    }\n}\n","steps":[{"a":1,"b":1,"t":"Trae la clase Scanner al programa. Sin este import, Java no sabe qué es Scanner y da error.","base":true},{"a":3,"b":5,"t":"La clase se llama igual que el archivo. main es el punto de entrada: Java empieza a ejecutar aquí dentro.","base":true},{"a":8,"b":8,"t":"Crea el lector del teclado. System.in es la entrada estándar. El nombre teclado lo eliges tú.","base":true},{"a":11,"b":13,"t":"Los tres números de entrada.","base":false},{"a":16,"b":16,"t":"Variable para guardar el resultado.","base":false},{"a":19,"b":26,"t":"Se pide y se lee cada número.","base":false},{"a":29,"b":29,"t":"Media = suma / cantidad. Los paréntesis son obligatorios: sin ellos, solo el último número se dividiría entre 3 por la prioridad de operadores.","base":false},{"a":33,"b":33,"t":"%.2f muestra 2 decimales y %n salta de línea. El valor debe ir tras una coma.","base":false},{"a":35,"b":35,"t":"Cierra el Scanner para liberar el recurso. Va al final.","base":true}],"ojo":"Igual que el IMC: printf(\"La media ...: %.2f%n\" + media) falla con MissingFormatArgumentException. Lo correcto: System.out.printf(\"La media de los tres números es: %.2f%n\", media); Si Windows está en español, el Scanner espera los decimales con COMA (3,5) y no con punto. Si escribes 3.5 da InputMismatchException.","labelFull":"unidad 1 ejercicio 5"},{"id":"Ejercicio6_Unidad1","kind":"ej","label":"U1·E6","grupo":"Unidad 1","orden":10006,"file":"Ejercicio6_Unidad1.java","titulo":"Rentabilidad de una inversión en BTC","enun":"Con precio de compra, precio actual y cantidad de BTC, calcula inversión inicial, valor actual, ganancia y rentabilidad (%).","tags":["Scanner","nextDouble","double","aritméticos","printf"],"kw":["bitcoin","inversion","ganancia","perdida","rentabilidad","porcentaje","euros","formulas","simbolo porcentaje"],"code":"import java.util.Scanner;\n\npublic class Ejercicio6_Unidad1 {\n\n    public static void main(String[] args) {\n\n        // Creamos el objeto Scanner para leer datos del teclado\n        Scanner teclado = new Scanner(System.in);\n\n\n        // Variables que introduce el usuario\n        double precioCompraEuros;\n        double precioActualEuros;\n        double cantidadBtc;\n\n        // Variables para almacenar los resultados\n        double importeInicial;\n        double valorActual;\n        double ganancia;\n        double rentabilidad;\n\n        // Pedimos los datos de la inversión\n        System.out.print(\"Introduce el precio de compra de 1 BTC (€): \");\n        precioCompraEuros = teclado.nextDouble();\n\n        System.out.print(\"Introduce el precio actual de 1 BTC (€): \");\n        precioActualEuros = teclado.nextDouble();\n\n        System.out.print(\"Introduce la cantidad de BTC adquirida: \");\n        cantidadBtc = teclado.nextDouble();\n\n        // Importe inicial = precio de compra * cantidad\n        importeInicial = precioCompraEuros * cantidadBtc;\n\n        // Valor actual = precio actual * cantidad\n        valorActual = precioActualEuros * cantidadBtc;\n\n        // Ganancia (o pérdida si sale negativa) = valor actual - importe inicial\n        ganancia = valorActual - importeInicial;\n\n        // Rentabilidad (%) = ganancia / importe inicial * 100\n        rentabilidad = (ganancia / importeInicial) * 100;\n\n        // Mostramos los resultados con sus unidades\n        System.out.println(\"\\n******************************************\\n\");\n        System.out.printf(\"Inversión inicial: %.2f €%n\", importeInicial);\n        System.out.printf(\"Valor actual: %.2f €%n\", valorActual);\n        System.out.printf(\"Ganancia/pérdida: %.2f €%n\", ganancia);\n        System.out.printf(\"Rentabilidad: %.2f %%%n\", rentabilidad);\n\n\n\n    }\n\n\n}\n","steps":[{"a":1,"b":1,"t":"Trae la clase Scanner al programa. Sin este import, Java no sabe qué es Scanner y da error.","base":true},{"a":3,"b":5,"t":"La clase se llama igual que el archivo. main es el punto de entrada: Java empieza a ejecutar aquí dentro.","base":true},{"a":8,"b":8,"t":"Crea el lector del teclado. System.in es la entrada estándar. El nombre teclado lo eliges tú.","base":true},{"a":12,"b":14,"t":"Los tres datos que da el usuario.","base":false},{"a":17,"b":20,"t":"Los cuatro resultados que se calculan. Declarar todo arriba ayuda a ver de un vistazo qué datos tiene el programa.","base":false},{"a":23,"b":30,"t":"Se piden y leen los tres datos con nextDouble().","base":false},{"a":33,"b":33,"t":"Lo que pagaste = precio de compra por cantidad.","base":false},{"a":36,"b":36,"t":"Lo que vale ahora = precio actual por cantidad.","base":false},{"a":39,"b":39,"t":"Ganancia = valor actual menos lo invertido. Si sale negativa es una pérdida.","base":false},{"a":42,"b":42,"t":"Porcentaje = ganancia / inversión x 100. Los paréntesis agrupan la división antes de multiplicar.","base":false},{"a":45,"b":45,"t":"Una línea de asteriscos para separar. \\n dentro del texto es un salto de línea.","base":false},{"a":46,"b":49,"t":"Cada printf lleva %.2f (2 decimales) y %n (salto). Para escribir el símbolo % hay que poner %% doble, porque un solo % empieza un formato.","base":false}],"ojo":"No hay teclado.close(); el programa funciona igual, pero conviene cerrar el Scanner al final como en los demás. Si Windows está en español, el Scanner espera los decimales con COMA (3,5) y no con punto. Si escribes 3.5 da InputMismatchException.","labelFull":"unidad 1 ejercicio 6"},{"id":"Ejercicio1_Unidad2","kind":"ej","label":"U2·B1·E1","grupo":"Unidad 2 · Bloque 1","orden":20101,"file":"Ejercicio1_Unidad2.java","titulo":"Ciudad con la temperatura más alta","enun":"Compara las temperaturas máximas de dos ciudades y dice cuál tiene la mayor.","tags":["Scanner","nextDouble","double","if","else if","comparaciones","máximo"],"kw":["mayor de dos numeros","comparar dos numeros","temperatura","ciudad","condicional","cual es mayor"],"code":"import java.util.Scanner;\n\npublic class Ejercicio1_Unidad2 {\n    public static void main(String[] args) {\n        Scanner teclado = new Scanner(System.in);\n\n        double temperaturaMaxima1 , temperaturaMaxima2;\n\n        System.out.print(\"Introduce la temperatura máxima de la ciudad 1: \");\n        temperaturaMaxima1 = teclado.nextDouble();\n        System.out.print(\"Introduce la temperatura maxima de la ciudad 2: \");\n        temperaturaMaxima2 = teclado.nextDouble();\n\n        if (temperaturaMaxima1 > temperaturaMaxima2) {\n            System.out.println(\"La ciudad 1 tiene la temperatura mayor: \" + temperaturaMaxima1 + \" °C\");\n        }else\n            if (temperaturaMaxima1 < temperaturaMaxima2) {\n                System.out.println(\"La ciudad 2 tiene la temperatura mayor: \" + temperaturaMaxima2 + \" °C\");\n            }\n\n        teclado.close();\n    }\n}\n","steps":[{"a":1,"b":1,"t":"Trae la clase Scanner al programa. Sin este import, Java no sabe qué es Scanner y da error.","base":true},{"a":3,"b":4,"t":"La clase se llama igual que el archivo. main es el punto de entrada: Java empieza a ejecutar aquí dentro.","base":true},{"a":5,"b":5,"t":"Crea el lector del teclado. System.in es la entrada estándar. El nombre teclado lo eliges tú.","base":true},{"a":7,"b":7,"t":"Dos variables en una línea separadas por coma: se puede declarar varias del mismo tipo a la vez.","base":false},{"a":9,"b":12,"t":"Se leen las dos temperaturas.","base":false},{"a":14,"b":15,"t":"Si la ciudad 1 es mayor, se dice. La condición va entre paréntesis y el bloque entre llaves.","base":false},{"a":16,"b":18,"t":"Si no, se comprueba si la 2 es mayor con otro if.","base":false},{"a":21,"b":21,"t":"Cierra el Scanner para liberar el recurso. Va al final.","base":true}],"ojo":"Si las dos temperaturas son iguales no se imprime nada, porque no hay un else final. En el ejercicio siguiente se resuelve con else.","labelFull":"unidad 2 bloque 1 ejercicio 1"},{"id":"Ejercicio2_Unidad2","kind":"ej","label":"U2·B1·E2","grupo":"Unidad 2 · Bloque 1","orden":20102,"file":"Ejercicio2_Unidad2.java","titulo":"Establecimiento con el precio menor","enun":"Compara el precio de un producto en dos establecimientos y muestra cuál es más barato (o si son iguales).","tags":["Scanner","nextDouble","double","if","else if","if-else","comparaciones","mínimo"],"kw":["menor de dos numeros","comparar precios","mas barato","iguales","condicional"],"code":"import java.util.Scanner;\n\npublic class Ejercicio2_Unidad2 {\n    public static void main(String[] args) {\n        Scanner teclado = new Scanner(System.in);\n\n        // double porque los precios tienen céntimos (ej: 12.99)\n        double Precio1, Precio2;\n\n        System.out.print(\"Introduce el precio en el establecimiento 1: \");\n        Precio1 = teclado.nextDouble();\n        System.out.println(\"Introduce el precio en el establecimiento 2: \");\n        Precio2 = teclado.nextDouble();\n\n        // Ahora buscamos el MENOR, por eso usamos \"<\" en lugar de \">\"\n        if (Precio1 < Precio2) {\n            System.out.println(\"El precio es menor que el establecimiento \" + Precio1 + \"€\");\n        }else\n            if (Precio1 > Precio2) {\n                System.out.println(\"El precio es mayor que el establecimiento \" + Precio2 + \"€\");\n            }else{\n                // Si ninguno es menor que el otro, los precios son iguales\n                System.out.println(\"Ambos establecimientos tienen el mismo precio: \" + Precio1);\n            }\n\n        teclado.close();\n    }\n}\n","steps":[{"a":1,"b":1,"t":"Trae la clase Scanner al programa. Sin este import, Java no sabe qué es Scanner y da error.","base":true},{"a":3,"b":4,"t":"La clase se llama igual que el archivo. main es el punto de entrada: Java empieza a ejecutar aquí dentro.","base":true},{"a":5,"b":5,"t":"Crea el lector del teclado. System.in es la entrada estándar. El nombre teclado lo eliges tú.","base":true},{"a":8,"b":8,"t":"Dos precios, double porque tienen céntimos (12.99).","base":false},{"a":10,"b":13,"t":"Se piden y leen los dos precios.","base":false},{"a":16,"b":17,"t":"Aquí se busca el MENOR, por eso se usa <.","base":false},{"a":18,"b":20,"t":"Segunda comprobación con >.","base":false},{"a":21,"b":23,"t":"El else final recoge lo que queda: si ninguno es menor que el otro, son iguales.","base":false},{"a":26,"b":26,"t":"Cierra el Scanner para liberar el recurso. Va al final.","base":true}],"ojo":"Los mensajes son confusos: dicen 'El precio es menor que el establecimiento 12€', pero no indican qué establecimiento es. Mejor: 'El establecimiento 1 es más barato: 12 €'.","labelFull":"unidad 2 bloque 1 ejercicio 2"},{"id":"Ejercicio3_Unidad2","kind":"ej","label":"U2·B1·E3","grupo":"Unidad 2 · Bloque 1","orden":20103,"file":"Ejercicio3_Unidad2.java","titulo":"Jugador con la puntuación más alta","enun":"Lee las puntuaciones de 5 jugadores y muestra la más alta y qué jugador la tiene.","tags":["Scanner","nextInt","int","if","if independientes","comparaciones","máximo"],"kw":["mayor de cinco numeros","quien gana","ganador","jugador","maximo de varios","puntuacion mas alta","variable provisional"],"code":"import java.util.Scanner;\n\npublic class Ejercicio3_Unidad2 {\n    public static void main(String[] args) {\n        Scanner teclado = new Scanner(System.in);\n\n        // Las puntuaciones son enteros, así que usamos int , en el caso de que la puntuacion fuera con decimales usariamos double\n        int puntiacion1, puntiacion2, puntiacion3, puntiacion4, puntuacion5;\n\n        // Variable que guardará la puntuación más alta\n        int puntuacionMaxima;\n\n        // Variable nueva: guardará el número del jugador que tiene la puntuación más alta\n        int jugadorGanador;\n\n        System.out.println(\"Puntuacion del jugador 1: \");\n        puntiacion1 = teclado.nextInt();\n        System.out.println(\"Puntuacion del jugador 2: \");\n        puntiacion2 = teclado.nextInt();\n        System.out.println(\"Puntuacion del jugador 3: \");\n        puntiacion3 = teclado.nextInt();\n        System.out.println(\"Puntuacion del jugador 4: \");\n        puntiacion4 = teclado.nextInt();\n        System.out.println(\"Puntuacion del jugador 5: \");\n        puntuacion5 = teclado.nextInt();\n\n        // El jugador 1 no se compara con nadie: es el punto de partida.\n        // Como todavía no hemos mirado a ningún otro jugador, lo damos por ganador provisional.\n        // Así puntuacionMaxima y jugadorGanador ya tienen un valor inicial con el que comparar al resto.\n        // (Si no se les diera valor, Java daría error al usarlas en los if.)\n        // Con 5 jugadores solo hacen falta 4 comparaciones: los otros cuatro tienen que quitarle el puesto.\n        puntuacionMaxima = puntiacion1;\n        jugadorGanador = 1;\n\n        // Comparamos la máxima actual con cada puntuación restante.\n        // Si alguna es mayor, pasa a ser la nueva máxima.\n        // Usamos \"if\" independientes (no \"else if\") porque hay que revisar TODAS\n        if (puntiacion2 > puntuacionMaxima) {\n            puntuacionMaxima = puntiacion2;\n            jugadorGanador = 2;\n        }\n        if (puntiacion3 > puntuacionMaxima) {\n            puntuacionMaxima = puntiacion3;\n            jugadorGanador = 3;\n        }\n        if (puntiacion4 > puntuacionMaxima) {\n            puntuacionMaxima = puntiacion4;\n            jugadorGanador = 4;\n        }\n        if (puntuacion5 > puntuacionMaxima) {\n            puntuacionMaxima = puntuacion5;\n            jugadorGanador = 5;\n        }\n\n        // Al terminar, puntuacionMaxima contiene la más alta de las cinco\n        System.out.println(\"La puntuación más alta es: \" + puntuacionMaxima);\n        System.out.println(\"Pertenece al jugador: \" + jugadorGanador);\n\n        teclado.close();\n\n\n\n\n    }\n\n\n\n\n\n}\n","steps":[{"a":1,"b":1,"t":"Trae la clase Scanner al programa. Sin este import, Java no sabe qué es Scanner y da error.","base":true},{"a":3,"b":4,"t":"La clase se llama igual que el archivo. main es el punto de entrada: Java empieza a ejecutar aquí dentro.","base":true},{"a":5,"b":5,"t":"Crea el lector del teclado. System.in es la entrada estándar. El nombre teclado lo eliges tú.","base":true},{"a":8,"b":8,"t":"Cinco variables int, una por jugador.","base":false},{"a":11,"b":14,"t":"puntuacionMaxima guarda la mejor nota vista hasta ahora y jugadorGanador el número de quien la tiene.","base":false},{"a":16,"b":25,"t":"Se leen las cinco puntuaciones.","base":false},{"a":32,"b":33,"t":"Truco del máximo: el jugador 1 empieza como ganador provisional, sin compararlo con nadie. Así las dos variables ya tienen un valor con el que comparar a los demás.","base":false},{"a":38,"b":40,"t":"Si el jugador 2 supera al ganador provisional, le quita el puesto: se actualizan la puntuación y el jugador.","base":false},{"a":42,"b":52,"t":"Lo mismo con el 3, el 4 y el 5. Son if separados, no else if, porque hay que revisar a todos.","base":false},{"a":56,"b":57,"t":"Al terminar, las dos variables contienen la respuesta.","base":false},{"a":59,"b":59,"t":"Cierra el Scanner para liberar el recurso. Va al final.","base":true}],"ojo":null,"labelFull":"unidad 2 bloque 1 ejercicio 3"},{"id":"Ejercicio4_Unidad2","kind":"e iempo5;\n        }\n\n        System.out.println(\"El menor tiempo registrado es: \" + tiempoMinimo + \" segundos\");\n\n        teclado.close();\n    }\n}\n","steps":[{"a":1,"b":1,"t":"Trae la clase Scanner al programa. Sin este import, Java no sabe qué es Scanner y da error.","base":true},{"a":3,"b":4,"t":"La clase se llama igual que el archivo. main es el punto de entrada: Java empieza a ejecutar aquí dentro.","base":true},{"a":5,"b":5,"t":"Crea el lector del teclado. System.in es la entrada estándar. El nombre teclado lo eliges tú.","base":true},{"a":8,"b":9,"t":"Cinco tiempos y una variable para el mínimo. double porque hay decimales (12.47 s).","base":false},{"a":12,"b":21,"t":"Se leen los cinco tiempos.","base":false},{"a":25,"b":25,"t":"Se parte suponiendo que el primero es el mínimo.","base":false},{"a":29,"b":39,"t":"Igual que el máximo pero con <: si un tiempo es menor que el mínimo actual, lo sustituye.","base":false},{"a":42,"b":42,"t":"Resultado final.","base":false},{"a":44,"b":44,"t":"Cierra el Scanner para liberar el recurso. Va al final.","base":true}],"ojo":null,"labelFull":"unidad 2 bloque 1 ejercicio 4"},{"id":"Ejercicio5_Unidad2","kind":"ej","label":"U2·B1·E5","grupo":"Unidad 2 · Bloque 1","orden":20105,"file":"Ejercicio5_Unidad2.java","titulo":"Temperatura máxima y mínima de 5 valores","enun":"Lee cinco temperaturas y muestra la máxima y la mínima.","tags":["Scanner","nextDouble","double","if","if independientes","comparaciones","máximo","mínimo"],"kw":["maximo y minimo","mayor y menor","temperaturas","extremos"],"code":"import java.util.Scanner;\n\npublic class Ejercicio5_Unidad2 {\n    public static void main(String[] args) {\n        Scanner teclado = new Scanner(System.in);\n\n        // double porque las temperaturas pueden tener decimales y ser negativas\n        double temperatura1 , temperatura2 , temperatura3 , temperatura4, temperatura5;\n        double temperaturaMaxima, temperaturaMinima;\n\n\n        System.out.println(\"Introduce la temperatura 1: \");\n        temperatura1 = teclado.nextDouble();\n        System.out.println(\"Introduce la temperatura 2: \");\n        temperatura2 = teclado.nextDouble();\n        System.out.println(\"Introduce la temperatura 3: \");\n        temperatura3 = teclado.nextDouble();\n        System.out.println(\"Introduce la temperatura 4: \");\n        temperatura4 = teclado.nextDouble();\n        System.out.println(\"Introduce la temperatura 5: \");\n        temperatura5 = teclado.nextDouble();\n\n        // Necesitamos dos variables: una para la máxima y otra para la mínima.\n        // Ambas empiezan valiendo la primera temperatura\n        temperaturaMaxima = temperatura1;\n        temperaturaMinima = temperatura1;\n\n        // BLOQUE 1: buscar la máxima (si es mayor que la actual, la sustituye)\n        if (temperatura2 > temperaturaMaxima) {\n            temperaturaMaxima = temperatura2;\n        }\n        if (temperatura3 > temperaturaMaxima) {\n            temperaturaMaxima = temperatura3;\n        }\n        if (temperatura4 > temperaturaMaxima) {\n            temperaturaMaxima = temperatura4;\n        }\n        if (temperatura5 > temperaturaMaxima) {\n            temperaturaMaxima = temperatura5;\n        }\n\n        // BLOQUE 2: buscar la mínima (si es menor que la actual, la sustituye).\n        // Va en un bloque aparte porque cada temperatura hay que\n        // compararla con la máxima y también con la mínima\n        if (temperatura2 < temperaturaMinima) {\n            temperaturaMinima = temperatura2;\n        }\n        if (temperatura3 < temperaturaMinima) {\n            temperaturaMinima = temperatura3;\n        }\n        if (temperatura4 < temperaturaMinima) {\n            temperaturaMinima = temperatura4;\n        }\n        if (temperatura5 < temperaturaMinima) {\n            temperaturaMinima = temperatura5;\n        }\n\n        System.out.println(\"La temperatura máxima es: \" + temperaturaMaxima);\n        System.out.println(\"La temperatura mínima es: \" + temperaturaMinima);\n\n        teclado.close();\n    }\n}\n","steps":[{"a":1,"b":1,"t":"Trae la clase Scanner al programa. Sin este import, Java no sabe qué es Scanner y da error.","base":true},{"a":3,"b":4,"t":"La clase se llama igual que el archivo. main es el punto de entrada: Java empieza a ejecutar aquí dentro.","base":true},{"a":5,"b":5,"t":"Crea el lector del teclado. System.in es la entrada estándar. El nombre teclado lo eliges tú.","base":true},{"a":8,"b":9,"t":"Cinco temperaturas y dos variables para los resultados.","base":false},{"a":12,"b":21,"t":"Se leen las cinco temperaturas.","base":false},{"a":25,"b":26,"t":"Las dos empiezan valiendo la primera temperatura.","base":false},{"a":29,"b":39,"t":"Bloque 1: busca la máxima.","base":false},{"a":45,"b":55,"t":"Bloque 2: busca la mínima. Va aparte porque cada valor se compara con la máxima y también con la mínima.","base":false},{"a":58,"b":59,"t":"Se muestran las dos.","base":false},{"a":61,"b":61,"t":"Cierra el Scanner para liberar el recurso. Va al final.","base":true}],"ojo":null,"labelFull":"unidad 2 bloque 1 ejercicio 5"},{"id":"Ejercicio6_Unidad2","kind":"ej","label":"U2·B1·E6","grupo":"Unidad 2 · Bloque 1","orden":20106,"file":"Ejercicio6_Unidad2.java","titulo":"Par o impar con el operador %","enun":"Lee un entero y dice si es par o impar.","tags":["Scanner","nextInt","int","módulo %","if-else","par o impar"],"kw":["par o impar","resto de la division","modulo","divisible entre 2","paridad"],"code":"import java.util.Scanner;\n\npublic class Ejercicio6_Unidad2 {\n    public static void main(String[] args) {\n        Scanner teclado = new Scanner(System.in);\n\n        // int porque pide un número entero\n        int numero;\n\n        System.out.println(\"Introduce un número entero: \");\n        numero = teclado.nextInt();\n\n        // % devuelve el RESTO de la división.\n        // Si al dividir entre 2 el resto es 0, el número es par.\n        // Comparamos con 0 (y no con 1) porque con negativos, -3 % 2 da -1 en Java\n        if (numero % 2 == 0) {\n            System.out.println(\"El número \" + numero + \" es par.\");\n        } else {\n            // Si el resto no es 0, solo puede ser impar\n            System.out.println(\"El número \" + numero + \" es impar.\");\n        }\n\n        teclado.close();\n    }\n}\n","steps":[{"a":1,"b":1,"t":"Trae la clase Scanner al programa. Sin este import, Java no sabe qué es Scanner y da error.","base":true},{"a":3,"b":4,"t":"La clase se llama igual que el archivo. main es el punto de entrada: Java empieza a ejecutar aquí dentro.","base":true},{"a":5,"b":5,"t":"Crea el lector del teclado. System.in es la entrada estándar. El nombre teclado lo eliges tú.","base":true},{"a":10,"b":11,"t":"Se lee el número entero.","base":false},{"a":16,"b":17,"t":"% devuelve el RESTO de la división. Si al dividir entre 2 el resto es 0, es par. Atención: = asigna y == compara.","base":false},{"a":18,"b":20,"t":"Si el resto no es 0, solo puede ser impar.","base":false},{"a":23,"b":23,"t":"Cierra el Scanner para liberar el recurso. Va al final.","base":true}],"ojo":"Se compara con 0 y no con 1 porque en Java -3 % 2 da -1 (no 1): comparar con 1 fallaría con negativos impares.","labelFull":"unidad 2 bloque 1 ejercicio 6"},{"id":"Ejercicio7_Unidad2","kind":"ej","label":"U2·B1·E7","grupo":"Unidad 2 · Bloque 1","orden":20107,"file":"Ejercicio7_Unidad2.java","titulo":"Par o impar con el operador & (bits)","enun":"Lo mismo que el anterior pero usando el AND a nivel de bits.","tags":["Scanner","nextInt","int","bit a bit &","if-else","par o impar"],"kw":["par o impar","operador and","bits","ultimo bit","binario","paridad"],"code":"import java.util.Scanner;\n\npublic class Ejercicio7_Unidad2 {\n    public static void main(String[] args) {\n        Scanner teclado = new Scanner(System.in);\n\n        int numero;\n\n        System.out.println(\"Introduce un número entero: \");\n        numero = teclado.nextInt();\n\n        // & es el AND a nivel de bits: compara los bits de dos números uno a uno.\n        // \"numero & 1\" deja solo el último bit (el menos significativo) del número.\n        // En binario, los pares terminan siempre en 0 y los impares en 1.\n        // Ejemplo: 6 = 110 -> 110 & 001 = 0 (par) | 7 = 111 -> 111 & 001 = 1 (impar)\n        // Los paréntesis son necesarios porque == tiene más prioridad que &\n        if ((numero & 1) == 0) {\n            System.out.println(\"El número \" + numero + \" es par.\");\n        } else {\n            System.out.println(\"El número \" + numero + \" es impar.\");\n        }\n\n        teclado.close();\n    }\n}\n","steps":[{"a":1,"b":1,"t":"Trae la clase Scanner al programa. Sin este import, Java no sabe qué es Scanner y da error.","base":true},{"a":3,"b":4,"t":"La clase se llama igual que el archivo. main es el punto de entrada: Java empieza a ejecutar aquí dentro.","base":true},{"a":5,"b":5,"t":"Crea el lector del teclado. System.in es la entrada estándar. El nombre teclado lo eliges tú.","base":true},{"a":9,"b":10,"t":"Se lee el número entero.","base":false},{"a":17,"b":18,"t":"& compara los bits de dos números. numero & 1 deja solo el último bit: 0 si es par, 1 si es impar (6 = 110 → 0, 7 = 111 → 1). Los paréntesis son obligatorios porque == tiene más prioridad que &.","base":false},{"a":19,"b":20,"t":"Si el último bit es 1, es impar.","base":false},{"a":23,"b":23,"t":"Cierra el Scanner para liberar el recurso. Va al final.","base":true}],"ojo":null,"labelFull":"unidad 2 bloque 1 ejercicio 7"},{"id":"Ejercicio1_Unidad2_B2","kind":"ej","label":"U2·B2·E1","grupo":"Unidad 2 · Bloque 2","orden":20201,"file":"Ejercicio1_Unidad2_B2.java","titulo":"Participar en una actividad por edad y autorización","enun":"Puede participar quien tenga 18 o más años, o 16 y 17 años con autorización.","tags":["Scanner","nextInt","nextBoolean","int","boolean","&& y ||","if-else","comparaciones"],"kw":["condiciones combinadas","operadores logicos","y","o","parentesis","autorizacion","edad","verdadero o falso"],"code":"import java.util.Scanner;\n\npublic class Ejercicio1_Unidad2_B2 {\n    public static void main(String[] args) {\n        Scanner teclado = new Scanner(System.in);\n\n        int edad;\n\n        //Pedimos la edad en numero entero\n        System.out.print(\"Ingrese su edad: \");\n        edad = teclado.nextInt();\n\n        //Pedimos la autorizacion (Solo acepta true o false)\n        System.out.print(\"Ingrese su autorizacion? (True/false) : \");\n\n        // Creamos una variable de tipo boolean llamada \"autorizacion\".\n        // teclado.nextBoolean() espera a que el usuario escriba la palabra\n        // true o false (en inglés) y la guarda.\n        // IMPORTANTE: nosotros NO decidimos si vale true o false,\n        // lo decide el usuario al escribirlo.\n        boolean autorizacion = teclado.nextBoolean();\n\n        // Puede participar si:\n        //   - tiene 18 o más años (||) o bien\n        //   - tiene 16 o 17 años Y además tiene autorización\n        // Los paréntesis agrupan las condiciones para que se evalúen en el orden correcto\n\n        if (edad >= 18 || ((edad == 16 || edad == 17) && autorizacion)) {\n            System.out.println(\"Puedes participar en la actividad.\");\n        } else {\n            // Cualquier otro caso\n            System.out.println(\"No puedes participar en la actividad.\");\n        }\n\n        // Cerramos el Scanner para liberar el recurso\n        teclado.close();\n\n    }\n}\n","steps":[{"a":1,"b":1,"t":"Trae la clase Scanner al programa. Sin este import, Java no sabe qué es Scanner y da error.","base":true},{"a":3,"b":4,"t":"La clase se llama igual que el archivo. main es el punto de entrada: Java empieza a ejecutar aquí dentro.","base":true},{"a":5,"b":5,"t":"Crea el lector del teclado. System.in es la entrada estándar. El nombre teclado lo eliges tú.","base":true},{"a":10,"b":11,"t":"La edad es un entero.","base":false},{"a":14,"b":21,"t":"nextBoolean() lee la palabra true o false (en inglés). No la decide el programa, la escribe el usuario.","base":false},{"a":28,"b":29,"t":"|| es O y && es Y. Es mayor de edad O (tiene 16 o 17 Y autorización). Los paréntesis agrupan para evaluar en el orden correcto.","base":false},{"a":30,"b":32,"t":"Cualquier otro caso queda sin permiso.","base":false},{"a":36,"b":36,"t":"Cierra el Scanner para liberar el recurso. Va al final.","base":true}],"ojo":null,"labelFull":"unidad 2 bloque 2 ejercicio 1"},{"id":"Ejercicio2_Unidad2_B2","kind":"ej","label":"U2·B2·E2","grupo":"Unidad 2 · Bloque 2","orden":20202,"file":"Ejercicio2_Unidad2_B2.java","titulo":"Descuento por importe o por cliente habitual","enun":"Hay descuento si la compra supera 100 €, o si es cliente habitual y supera 50 €.","tags":["Scanner","nextDouble","nextBoolean","double","boolean","&& y ||","if-else","comparaciones"],"kw":["condiciones combinadas","operadores logicos","descuento","cliente","importe","compra","verdadero o falso"],"code":"import java.util.Scanner;\n\npublic class Ejercicio2_Unidad2_B2 {\n    public static void main(String[] args) {\n        Scanner teclado = new Scanner(System.in);\n\n\n        double importe;\n        // boolean: guarda true si es cliente habitual, false si no lo es.\n        boolean clienteHabitual;\n\n        System.out.print(\"Introduce el importe total de la compra: \");\n\n        // Usamos double (y no int) porque un importe puede tener decimales,\n        // por ejemplo 49.95 €. nextDouble() lee ese número con decimales.\n        importe = teclado.nextDouble();\n\n        System.out.print(\"¿Es cliente habitual? (true/false): \");\n\n        // boolean: guarda true si es cliente habitual, false si no lo es.\n        // Lo escribe el usuario por teclado.\n        clienteHabitual = teclado.nextBoolean();\n\n\n        // Tiene descuento si se cumple UNA de estas dos cosas:\n        //\n        //   importe > 100\n        //       -> la compra supera los 100 €. Da igual si es cliente habitual o no.\n        //\n        //   (clienteHabitual && importe > 50)\n        //       -> es cliente habitual Y ADEMÁS la compra supera los 50 €.\n        //          Las dos cosas a la vez, por eso usamos &&.\n        //\n        // Las dos partes van unidas con || (O): con que una se cumpla, hay descuento.\n\n        if (importe > 100 || (clienteHabitual && importe > 50)) {\n            System.out.println(\"Tienes derecho a descuento.\");\n        } else {\n            // Si no se cumple ninguna de las dos, no hay descuento\n            System.out.println(\"No se aplica descuento.\");\n        }\n\n        teclado.close();\n\n    }\n}\n","steps":[{"a":1,"b":1,"t":"Trae la clase Scanner al programa. Sin este import, Java no sabe qué es Scanner y da error.","base":true},{"a":3,"b":4,"t":"La clase se llama igual que el archivo. main es el punto de entrada: Java empieza a ejecutar aquí dentro.","base":true},{"a":5,"b":5,"t":"Crea el lector del teclado. System.in es la entrada estándar. El nombre teclado lo eliges tú.","base":true},{"a":8,"b":10,"t":"double para el importe (con céntimos) y boolean para el sí/no de cliente habitual.","base":false},{"a":12,"b":16,"t":"nextDouble() lee el importe con decimales.","base":false},{"a":18,"b":22,"t":"nextBoolean() lee true o false.","base":false},{"a":36,"b":37,"t":"Con que se cumpla UNA de las dos partes hay descuento (||). La segunda necesita las dos cosas a la vez (&&): cliente habitual Y más de 50 €.","base":false},{"a":38,"b":40,"t":"Si no se cumple ninguna, no hay descuento.","base":false},{"a":43,"b":43,"t":"Cierra el Scanner para liberar el recurso. Va al final.","base":true}],"ojo":null,"labelFull":"unidad 2 bloque 2 ejercicio 2"},{"id":"Ejercicio3_Unidad2_B2","kind":"ej","label":"U2·B2·E3","grupo":"Unidad 2 · Bloque 2","orden":20203,"file":"Ejercicio3_Unidad2_B2.java","titulo":"Participar en una competición (edad, licencia, autorización y revisión)","enun":"Mayores de edad con licencia y revisión técnica, o de 16 a 17 años con autorización y revisión técnica.","tags":["Scanner","nextInt","nextBoolean","int","boolean","&& y ||","if-else","comparaciones"],"kw":["condiciones combinadas","operadores logicos","entre 16 y 17","rango","licencia","revision","una sola expresion","verdadero o falso"],"code":"import java.util.Scanner;\n\npublic class Ejercicio3_Unidad2_B2 {\n    public static void main(String[] args) {\n        Scanner teclado = new Scanner(System.in);\n\n        int edad;\n        boolean licencia;\n        boolean autorizacion;\n        boolean revision;\n\n        // ---------- PEDIMOS LOS DATOS ---------- //\n\n        System.out.print(\"Introduce tu edad: \");\n        edad = teclado.nextInt();             // número entero\n\n        System.out.print(\"¿Tienes licencia federativa? (true/false): \");\n        licencia = teclado.nextBoolean();     // true o false\n\n        System.out.print(\"¿Tienes autorización especial? (true/false): \");\n        autorizacion = teclado.nextBoolean(); // true o false\n\n        System.out.print(\"¿Has superado la revisión técnica? (true/false): \");\n        revision = teclado.nextBoolean();     // true o false\n\n        // ---------- COMPROBAMOS LAS CONDICIONES ----------\n        // Hay DOS formas de poder participar, unidas con || (O):\n        //\n        // FORMA A (mayores de edad), las tres cosas a la vez (&&):\n        //     edad >= 18   Y   licencia   Y   revision\n        //\n        // FORMA B (16 y 17 años), las cuatro cosas a la vez (&&):\n        //     edad >= 16   Y   edad <= 17   Y   autorizacion   Y   revision\n        //\n        // OJO: \"edad >= 16 && edad <= 17\" es cómo se escribe \"entre 16 y 17\".\n        // En Java NO se puede escribir \"16 <= edad <= 17\" como en matemáticas;\n        // hay que separarlo en dos comparaciones unidas con &&.\n        //\n        // Los paréntesis separan la forma A de la forma B para que Java no se líe.\n        // Lo hemos escrito en dos líneas para que se lea mejor, pero es una\n        // ÚNICA expresión, como pide el enunciado.\n        if ((edad >= 18 && licencia && revision)\n                || (edad >= 16 && edad <= 17 && autorizacion && revision)) {\n            System.out.println(\"Puedes participar en la competición.\");\n        } else {\n            // Cualquier otra combinación: no puede participar\n            System.out.println(\"No puedes participar en la competición.\");\n        }\n\n        teclado.close();\n\n\n    }\n\n\n}\n","steps":[{"a":1,"b":1,"t":"Trae la clase Scanner al programa. Sin este import, Java no sabe qué es Scanner y da error.","base":true},{"a":3,"b":4,"t":"La clase se llama igual que el archivo. main es el punto de entrada: Java empieza a ejecutar aquí dentro.","base":true},{"a":5,"b":5,"t":"Crea el lector del teclado. System.in es la entrada estándar. El nombre teclado lo eliges tú.","base":true},{"a":7,"b":10,"t":"Una edad entera y tres boolean.","base":false},{"a":14,"b":24,"t":"Se lee la edad con nextInt() y los tres sí/no con nextBoolean().","base":false},{"a":42,"b":43,"t":"Hay dos formas de participar unidas con ||. Forma A: 18+ Y licencia Y revisión. Forma B: 16–17 Y autorización Y revisión. Los paréntesis separan A de B.","base":false},{"a":44,"b":47,"t":"Si se cumple una de las dos formas, puede; en cualquier otro caso, no.","base":false},{"a":50,"b":50,"t":"Cierra el Scanner para liberar el recurso. Va al final.","base":true}],"ojo":"'Entre 16 y 17' se escribe edad >= 16 && edad <= 17. En Java no existe 16 <= edad <= 17 como en matemáticas.","labelFull":"unidad 2 bloque 2 ejercicio 3"},{"id":"Ejercicio1_Unidad3_B1","kind":"ej","label":"U3·B1·E1","grupo":"Unidad 3 · Bloque 1","orden":30101,"file":"Ejercicio1_Unidad3_B1.java","titulo":"Suma de 4 puntuaciones mayores que 10","enun":"Lee 4 puntuaciones y suma solo las que son mayores que 10.","tags":["Scanner","nextInt","int","for","if","acumulador","comparaciones"],"kw":["sumar","suma con condicion","puntuaciones","bucle for","repetir 4 veces","sumar si"],"code":"import java.util.Scanner;\n\npublic class Ejercicio1_Unidad3_B1 {\n    public static void main(String[] args) {\n        Scanner teclado = new Scanner(System.in);\n\n        // Variable donde iremos acumulando la suma de las puntuaciones válidas.\n        // IMPORTANTE: hay que inicializarla a 0, si no empezaría con un valor basura.\n        int suma = 0;\n\n        // Variable donde guardamos cada puntuación que escribe el usuario\n        int puntuacion;\n\n        // Bucle for: se repite 4 veces porque el enunciado pide cuatro puntuaciones.\n        // Un for tiene 3 partes separadas por ;\n        //   1) int i = 1  -> contador que empieza en 1 (se ejecuta solo una vez, al principio)\n        //   2) i <= 4     -> condición: mientras sea verdadera, el bucle sigue\n        //   3) i++        -> después de cada vuelta, el contador sube 1\n        // Vueltas: i=1, i=2, i=3, i=4. Cuando i vale 5 la condición falla y el bucle termina.\n        for (int i = 1; i <= 4; i++) {\n\n            // Pedimos la puntuación (usamos i para mostrar el número de la prueba)\n            System.out.print(\"Introduce la puntuacion \" + i + \": \");\n            puntuacion = teclado.nextInt();\n\n            // Solo sumamos si la puntuación es MAYOR que 10.\n            // Con > 10 el valor 10 NO se suma (con >= 10 sí se sumaría).\n            if (puntuacion > 10) {\n                // suma += puntuacion equivale a: suma = suma + puntuacion\n                suma += puntuacion;\n            }\n            // Si no es mayor que 10, no hacemos nada y pasamos a la siguiente vuelta\n        }\n\n        // Al salir del bucle ya tenemos todas las puntuaciones procesadas\n        System.out.println(\"La suma de las puntuaciones validas es: \" + suma);\n\n        // Cerramos el Scanner para liberar el recurso\n        teclado.close();\n\n    }\n}\n","steps":[{"a":1,"b":1,"t":"Trae la clase Scanner al programa. Sin este import, Java no sabe qué es Scanner y da error.","base":true},{"a":3,"b":4,"t":"La clase se llama igual que el archivo. main es el punto de entrada: Java empieza a ejecutar aquí dentro.","base":true},{"a":5,"b":5,"t":"Crea el lector del teclado. System.in es la entrada estándar. El nombre teclado lo eliges tú.","base":true},{"a":9,"b":9,"t":"Acumulador: va guardando el total. Hay que inicializarlo a 0; si no, empezaría con un valor basura.","base":false},{"a":12,"b":12,"t":"Aquí se guarda cada puntuación que escribe el usuario.","base":false},{"a":20,"b":20,"t":"for tiene 3 partes separadas por ;  1) int i = 1: contador inicial. 2) i <= 4: condición para seguir. 3) i++: sube 1 tras cada vuelta. Da 4 vueltas (i = 1, 2, 3, 4).","base":false},{"a":23,"b":24,"t":"Se pide la puntuación, mostrando i para saber cuál es.","base":false},{"a":28,"b":30,"t":"Solo se suma si es mayor que 10 (con >= 10 también sumaría el 10). suma += x equivale a suma = suma + x.","base":false},{"a":36,"b":36,"t":"Fuera del bucle, ya con todo procesado, se muestra el resultado.","base":false},{"a":39,"b":39,"t":"Cierra el Scanner para liberar el recurso. Va al final.","base":true}],"ojo":null,"labelFull":"unidad 3 bloque 1 ejercicio 1"},{"id":"Ejercicio2_Unidad3_B1","kind":"ej","label":"U3·B1·E2","grupo":"Unidad 3 · Bloque 1","orden":30102,"file":"Ejercicio2_Unidad3_B1.java","titulo":"Suma de N puntuaciones mayores que 10","enun":"Igual que el anterior, pero el usuario decide cuántas puntuaciones introduce.","tags":["Scanner","nextInt","int","for","if","acumulador","comparaciones"],"kw":["sumar","numero variable de vueltas","cantidad","bucle for","sumar si","puntuaciones"],"code":"import java.util.Scanner;\n\npublic class Ejercicio2_Unidad3_B1 {\n    public static void main(String[] args) {\n        Scanner teclado = new Scanner(System.in);\n\n        // Cuántas puntuaciones va a introducir el usuario (lo decide él)\n        int cantidad;\n\n        // Acumulador de la suma, empieza en 0\n        int suma = 0;\n\n        // Variable para guardar cada puntuación\n        int puntuacion;\n\n        // Primero preguntamos cuántas puntuaciones quiere introducir\n        System.out.print(\"Cuantas puntuaciones quieres introducir? \");\n        cantidad = teclado.nextInt();\n\n        // La diferencia con el ejercicio 1 está en la condición del for:\n        // antes era i <= 4 (número fijo) y ahora es i <= cantidad (número variable).\n        // Si el usuario escribe 6, el bucle da 6 vueltas; si escribe 2, da 2 vueltas.\n        for (int i = 1; i <= cantidad; i++) {\n\n            // Pedimos la puntuación número i\n            System.out.print(\"Introduce la puntuacion \" + i + \": \");\n            puntuacion = teclado.nextInt();\n\n            // Solo sumamos las puntuaciones mayores que 10\n            if (puntuacion > 10) {\n                suma += puntuacion;\n            }\n        }\n\n        // Mostramos el resultado final una vez terminado el bucle\n        System.out.println(\"La suma de las puntuaciones validas es: \" + suma);\n\n        // Cerramos el Scanner\n        teclado.close();\n    }\n}\n","steps":[{"a":1,"b":1,"t":"Trae la clase Scanner al programa. Sin este import, Java no sabe qué es Scanner y da error.","base":true},{"a":3,"b":4,"t":"La clase se llama igual que el archivo. main es el punto de entrada: Java empieza a ejecutar aquí dentro.","base":true},{"a":5,"b":5,"t":"Crea el lector del teclado. System.in es la entrada estándar. El nombre teclado lo eliges tú.","base":true},{"a":8,"b":8,"t":"Guarda cuántas puntuaciones va a escribir el usuario.","base":false},{"a":11,"b":11,"t":"Acumulador de la suma, empieza en 0.","base":false},{"a":17,"b":18,"t":"Primero se pregunta cuántas.","base":false},{"a":23,"b":23,"t":"La diferencia con el anterior: en vez de i <= 4 (fijo) ahora es i <= cantidad (variable). Si escribe 6, da 6 vueltas.","base":false},{"a":26,"b":27,"t":"Se lee cada puntuación.","base":false},{"a":30,"b":31,"t":"Solo se suma si es mayor que 10.","base":false},{"a":36,"b":36,"t":"Resultado al terminar el bucle.","base":false},{"a":39,"b":39,"t":"Cierra el Scanner para liberar el recurso. Va al final.","base":true}],"ojo":null,"labelFull":"unidad 3 bloque 1 ejercicio 2"},{"id":"Ejercicio3_Unidad3_B1","kind":"ej","label":"U3·B1·E3","grupo":"Unidad 3 · Bloque 1","orden":30103,"file":"Ejercicio3_Unidad3_B1.java","titulo":"Contar temperaturas positivas y negativas","enun":"Lee N temperaturas y cuenta cuántas son positivas y cuántas negativas (el 0 no cuenta).","tags":["Scanner","nextInt","int","for","if","else if","contador","comparaciones"],"kw":["contar","cuantos positivos","cuantos negativos","temperaturas","mayor que cero","menor que cero"],"code":"import java.util.Scanner;\n\npublic class Ejercicio3_Unidad3_B1 {\n    public static void main(String[] args) {\n        Scanner teclado = new Scanner(System.in);\n\n        // Cuántas temperaturas va a introducir el usuario\n        int cantidad;\n\n        // Variable para guardar cada temperatura (entera, puede ser negativa)\n        int temperatura;\n\n        // CONTADORES: a diferencia de un acumulador, no suman el valor introducido,\n        // solo cuentan cuántas veces ocurre algo (suman 1 cada vez).\n        // Ambos empiezan en 0.\n        int positivas = 0;\n        int negativas = 0;\n\n        // Preguntamos cuántas temperaturas quiere introducir\n        System.out.print(\"Introduzca las temperaturas: \");\n        cantidad = teclado.nextInt();\n\n        // El bucle se repite tantas veces como temperaturas haya que leer\n        for (int i = 1; i <= cantidad; i++) {\n\n            // Pedimos la temperatura número i\n            System.out.print(\"Introduce la temperatura \" + i + \": \");\n            temperatura = teclado.nextInt();\n\n            // Si es mayor que 0, es positiva: sumamos 1 al contador de positivas\n            if (temperatura > 0) {\n                positivas++;   // equivale a: positivas = positivas + 1\n            }\n            // Si no es positiva, comprobamos si es menor que 0 (negativa)\n            else if (temperatura < 0) {\n                negativas++;\n            }\n            // Si no es ni mayor ni menor que 0, es exactamente 0.\n            // El enunciado dice que el 0 no se cuenta, así que no hacemos nada.\n        }\n\n        // Mostramos los dos contadores al terminar el bucle\n        System.out.println(\"Temperaturas positivas: \" + positivas);\n        System.out.println(\"Temperaturas negativas: \" + negativas);\n\n        // Cerramos el Scanner\n        teclado.close();\n    }\n}\n","steps":[{"a":1,"b":1,"t":"Trae la clase Scanner al programa. Sin este import, Java no sabe qué es Scanner y da error.","base":true},{"a":3,"b":4,"t":"La clase se llama igual que el archivo. main es el punto de entrada: Java empieza a ejecutar aquí dentro.","base":true},{"a":5,"b":5,"t":"Crea el lector del teclado. System.in es la entrada estándar. El nombre teclado lo eliges tú.","base":true},{"a":16,"b":17,"t":"CONTADORES: no suman el valor escrito, solo cuentan cuántas veces pasa algo (suman 1). Empiezan en 0.","base":false},{"a":20,"b":21,"t":"Se pregunta cuántas temperaturas serán.","base":false},{"a":24,"b":24,"t":"Una vuelta por cada temperatura.","base":false},{"a":27,"b":28,"t":"Se lee la temperatura número i.","base":false},{"a":31,"b":32,"t":"Si es mayor que 0, se suma 1 al contador de positivas. positivas++ equivale a positivas = positivas + 1.","base":false},{"a":35,"b":36,"t":"Si no, y es menor que 0, es negativa. Si no es ni lo uno ni lo otro es 0, y no se cuenta.","base":false},{"a":43,"b":44,"t":"Se muestran los dos contadores al final.","base":false},{"a":47,"b":47,"t":"Cierra el Scanner para liberar el recurso. Va al final.","base":true}],"ojo":null,"labelFull":"unidad 3 bloque 1 ejercicio 3"},{"id":"Ejercicio1_Unidad3_B2","kind":"ej","label":"U3·B2·E1","grupo":"Unidad 3 · Bloque 2","orden":30201,"file":"Ejercicio1_Unidad3_B2.java","titulo":"Media de N calificaciones","enun":"Lee N calificaciones y muestra su media.","tags":["Scanner","nextInt","nextDouble","double","for","acumulador","media"],"kw":["promedio","calificaciones","notas","sumar todo","dividir entre cantidad"],"code":"import java.util.Scanner;\n\npublic class Ejercicio1_Unidad3_B2 {\n    public static void main(String[] args) {\n        Scanner teclado = new Scanner(System.in);\n\n        // Cuántas calificaciones va a introducir el usuario\n        int cantidad;\n\n        // Cada calificación. Usamos double porque una nota puede tener decimales (7.5)\n        double calificacion;\n\n        // Acumulador: aquí sumamos TODAS las calificaciones. Empieza en 0.\n        double suma = 0;\n\n        // Aquí guardaremos el resultado de la media\n        double media;\n\n        // Preguntamos cuántas calificaciones quiere introducir\n        System.out.print(\"¿Cuantas calificaciones quieres introducir? --> \");\n        cantidad = teclado.nextInt();\n\n        // El bucle da tantas vueltas como calificaciones haya que leer\n        for (int i = 1; i <= cantidad; i++) {\n\n            // Pedimos la calificación número i\n            System.out.print(\"Introduce la calificacion \" + i + \": \");\n            calificacion = teclado.nextDouble();\n\n            // A diferencia del ejercicio de las puntuaciones, aquí sumamos TODAS\n            // (no hay ningún if), porque la media usa todos los valores.\n            suma += calificacion;\n        }\n\n        // La media se calcula FUERA del bucle, cuando ya tenemos la suma total:\n        // media = suma de todas las notas / cantidad de notas\n        // Como suma es double, la división también es decimal (no pierde los decimales).\n        // Si suma fuera int y cantidad int, Java haría una división entera y perdería decimales.\n        media = suma / cantidad;\n\n        // Mostramos la media\n        System.out.println(\"La media de las calificaciones es: \" + media);\n\n        // Cerramos el Scanner\n        teclado.close();\n    }\n}\n","steps":[{"a":1,"b":1,"t":"Trae la clase Scanner al programa. Sin este import, Java no sabe qué es Scanner y da error.","base":true},{"a":3,"b":4,"t":"La clase se llama igual que el archivo. main es el punto de entrada: Java empieza a ejecutar aquí dentro.","base":true},{"a":5,"b":5,"t":"Crea el lector del teclado. System.in es la entrada estándar. El nombre teclado lo eliges tú.","base":true},{"a":11,"b":11,"t":"double porque una nota puede tener decimales (7.5).","base":false},{"a":14,"b":14,"t":"Acumulador: aquí se suman TODAS las notas. Empieza en 0.","base":false},{"a":20,"b":21,"t":"Se pregunta cuántas notas habrá.","base":false},{"a":24,"b":24,"t":"Una vuelta por cada nota.","base":false},{"a":27,"b":32,"t":"Se lee la nota y se suma sin condición (no hay if), porque la media usa todos los valores.","base":false},{"a":39,"b":39,"t":"La media se calcula FUERA del bucle, cuando ya está la suma total. Como suma es double, la división conserva decimales (con dos int se perderían).","base":false},{"a":42,"b":42,"t":"Resultado.","base":false},{"a":45,"b":45,"t":"Cierra el Scanner para liberar el recurso. Va al final.","base":true}],"ojo":null,"labelFull":"unidad 3 bloque 2 ejercicio 1"},{"id":"Ejercicio2_Unidad3_B2","kind":"ej","label":"U3·B2·E2","grupo":"Unidad 3 · Bloque 2","orden":30202,"file":"Ejercicio2_Unidad3_B2.java","titulo":"Temperatura más alta y más baja de N valores","enun":"Lee N temperaturas y muestra la máxima y la mínima.","tags":["Scanner","nextInt","int","for","if","if independientes","máximo","mínimo","Integer.MAX_VALUE"],"kw":["maximo y minimo","mayor y menor","integer min value","valores extremos","inicializar maximo"],"code":"import java.util.Scanner;\n\npublic class Ejercicio2_Unidad3_B2 {\n    public static void main(String[] args) {\n        Scanner teclado = new Scanner(System.in);\n\n        // Cuántas temperaturas va a registrar el usuario\n        int cantidad;\n\n        // Cada temperatura que escribe el usuario (entera, puede ser negativa)\n        int temperatura;\n\n        // TRUCO para máximo y mínimo: hay que inicializarlos con valores \"extremos\".\n        // - maxima empieza en el valor MÁS BAJO posible de un int, así cualquier\n        //   temperatura que se introduzca será mayor y la sustituirá.\n        // - minima empieza en el valor MÁS ALTO posible de un int, así cualquier\n        //   temperatura que se introduzca será menor y la sustituirá.\n        // (Si empezáramos en 0, fallaría con temperaturas todas negativas o todas positivas)\n        int maxima = Integer.MIN_VALUE;\n        int minima = Integer.MAX_VALUE;\n\n        // Preguntamos cuántas temperaturas quiere registrar\n        System.out.print(\"¿Cuantas temperaturas quieres registrar? --> \");\n        cantidad = teclado.nextInt();\n\n        // Una vuelta por cada temperatura\n        for (int i = 1; i <= cantidad; i++) {\n\n            // Pedimos la temperatura número i\n            System.out.print(\"Introduce la temperatura \" + i + \": \");\n            temperatura = teclado.nextInt();\n\n            // Si la temperatura es mayor que la máxima guardada hasta ahora,\n            // pasa a ser la nueva máxima\n            if (temperatura > maxima) {\n                maxima = temperatura;\n            }\n\n            // Si la temperatura es menor que la mínima guardada hasta ahora,\n            // pasa a ser la nueva mínima.\n            // OJO: son dos if separados (no else if), porque con la primera\n            // temperatura se cumplen las dos condiciones a la vez.\n            if (temperatura < minima) {\n                minima = temperatura;\n            }\n        }\n\n        // Al terminar el bucle, maxima y minima contienen los valores buscados\n        System.out.println(\"La temperatura mas alta es: \" + maxima);\n        System.out.println(\"La temperatura mas baja es: \" + minima);\n\n        // Cerramos el Scanner\n        teclado.close();\n    }\n}\n","steps":[{"a":1,"b":1,"t":"Trae la clase Scanner al programa. Sin este import, Java no sabe qué es Scanner y da error.","base":true},{"a":3,"b":4,"t":"La clase se llama igual que el archivo. main es el punto de entrada: Java empieza a ejecutar aquí dentro.","base":true},{"a":5,"b":5,"t":"Crea el lector del teclado. System.in es la entrada estándar. El nombre teclado lo eliges tú.","base":true},{"a":19,"b":20,"t":"Truco del máximo y mínimo: se inicializan con valores extremos. maxima parte del int más bajo posible y minima del más alto, así cualquier temperatura las sustituye. Si empezaran en 0, fallaría con todo negativo o todo positivo.","base":false},{"a":23,"b":24,"t":"Se pregunta cuántas temperaturas.","base":false},{"a":27,"b":27,"t":"Una vuelta por temperatura.","base":false},{"a":30,"b":31,"t":"Se lee la temperatura.","base":false},{"a":35,"b":36,"t":"Si supera a la máxima guardada, es la nueva máxima.","base":false},{"a":43,"b":44,"t":"Si es menor que la mínima guardada, es la nueva mínima. Son dos if separados (no else if) porque con la primera temperatura se cumplen las dos.","base":false},{"a":49,"b":50,"t":"Al acabar, maxima y minima tienen los valores buscados.","base":false},{"a":53,"b":53,"t":"Cierra el Scanner para liberar el recurso. Va al final.","base":true}],"ojo":null,"labelFull":"unidad 3 bloque 2 ejercicio 2"},{"id":"Ejercicio3_Unidad3_B2","kind":"ej","label":"U3·B2·E3","grupo":"Unidad 3 · Bloque 2","orden":30203,"file":"Ejercicio3_Unidad3_B2.java","titulo":"Múltiplos de un número hasta 100 (while)","enun":"Muestra los múltiplos de un número entero positivo que sean menores o iguales que 100.","tags":["Scanner","nextInt","int","while","múltiplos","acumulador"],"kw":["multiplos","tabla del numero","bucle while","hasta 100","bucle infinito","sumar el mismo numero"],"code":"import java.util.Scanner;\n\npublic class Ejercicio3_Unidad3_B2 {\n    public static void main(String[] args) {\n        Scanner teclado = new Scanner(System.in);\n\n        // Número del que queremos los m
